name: PC Diagnose

# 目的（2026-11-05）：pc 作业在 master/PR 上持续红，但两条信息通道都断了 ——
#   ① Actions 日志 API 对非 admin 会话 403（build.yml 注释里自己也写了这条）；
#   ② pc 作业没有 Android 作业那种「失败把错误打进 ::error annotation」的步骤。
# 本工作流是**旁路诊断**：不动 build.yml，用与 pc 作业完全相同的配方（同生成器、
# 同参数、同目标）单独跑一次，失败时把错误行打进 annotation（公开仓库匿名可读）
# + job summary（公开可读），完整日志另传 artifact。
# 双触发：push 到本分支即跑（未合入默认分支时 dispatch API 不认，push 事件直接
# 执行分支上的工作流文件）；合入 master 后 workflow_dispatch 可用，ref 选诊断目标。
# 踩坑记录（2026-11-05）：
#   · v1 脚本 pwsh 解析崩溃（双引号里反引号是转义符，"```" 在解析期崩）——已修：围栏改单引号
#   · v2 只读 cpp_build.log（MSBuild 输出）——**漏了 CMake 报错的真正出处**：
#     build.yml Build 步注释写明「CMake 报错原文在 CMakeFiles/CMakeError.log」，
#     所以 v2 必须同时读 CMakeError.log + cpp_build.log，否则 link error 永远只能看到
#     「Process completed with exit code 1」（line 171 的裸退出码）。
#   · v3 **artifact 发布条件 bug**（run 1159 失败时 artifact 没上传）：
#     `if: failure()` 只覆盖**该 step**，前面的 Build 步 exit 1 时脚本根本没跑，
#     annotation 和 artifact 都出不来。所以 `if: always()` —— 无论死活都发，
#     失败时 annotation 兜底发错误行（error 标记公开可读），成功时也传一份无害。
# 2026-11-07：原先还挂了 push: [feat/ci-pc-annotations] —— 该分支早已合入并删除，
# 这个触发器永远不会命中，属于死配置。诊断一律手动 dispatch（可选 ref）。
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "诊断目标 ref/sha（默认 master）"
        required: false
        default: "master"

permissions:
  contents: write
  checks: write

jobs:
  pc-diag:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          submodules: recursive

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pc/web/package-lock.json

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 镜像变量先落档：win25-vs2026/20261103 昨天发布、今晨全红 ——
      # 把 ImageOS/ImageVersion/VS/MSVC 工具集版本钉进 summary，定位环境变化。
      - name: Toolchain snapshot
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationVersion
          $lines = @(
            "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion",
            "cmake=$(cmake --version | Select-Object -First 1)",
            "vswhere=$vs",
            "VCToolsVersion=$env:VCToolsVersion",
            "node=$(node --version)"
          )
          $lines | Tee-Object -FilePath toolchain.txt

      - name: Install web dependencies
        shell: pwsh
        working-directory: pc/web
        run: npm ci --no-audit --no-fund 2>&1 | Select-Object -Last 10

      - name: Configure
        shell: pwsh
        run: |
          cmake -S pc/host -B build_host -G "Visual Studio 18 2026" -A x64 `
            -DAPXPC_BUILD_SDK=OFF `
            -DAPXPC_BUILD_EXAMPLES=OFF `
            -DAPXPC_BUILD_UI=ON `
            -DAPXPC_BUILD_UI_WEBVIEW2=ON
          if ($LASTEXITCODE -ne 0) {
            "CONFIGURE_FAILED" | Out-File -FilePath diag_phase.txt
            exit $LASTEXITCODE
          }
          "configure ok" | Out-File -FilePath diag_phase.txt

      - name: Build (apxhost + apxdesktop + apxsetup)
        shell: pwsh
        run: |
          cmake --build build_host --config Release --target apxhost apxdesktop apxsetup 2>&1 | `
            Tee-Object -FilePath cpp_build.log | Select-Object -Last 30
          if ($LASTEXITCODE -ne 0) {
            "BUILD_FAILED" | Out-File -FilePath diag_phase.txt -Append
            exit $LASTEXITCODE
          }

      - name: Publish diagnosis (annotation + summary)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $phase = "unknown"
          if (Test-Path diag_phase.txt) {
            $phase = ((Get-Content diag_phase.txt | Where-Object { $_ }) -join " | ")
          }
          # ★ CMakeError.log：CMake 报错的真正出处（build.yml Build 步注释白纸黑字写明）
          # ★ cpp_build.log：MSBuild 输出（link 失败时可能只有 tail，CMake 层更靠得住）
          $cmakeErr = @()
          if (Test-Path "build_host/CMakeFiles/CMakeError.log") {
            $cmakeErr = @(Get-Content "build_host/CMakeFiles/CMakeError.log" -Tail 60)
          }
          $buildErr = @()
          if (Test-Path cpp_build.log) {
            $buildErr = @(Get-Content cpp_build.log -Tail 30)
          }
          # 两个源去重合并（CMakeError.log 的 link 错误通常比 MSBuild tail 更完整）
          $allErr = @() | Where-Object { $null -ne $_ }
          foreach ($s in @($cmakeErr, $buildErr)) {
            foreach ($l in $s) {
              if ($l -match "error [A-Z]+\d+" -or $l -match "fatal error" -or $l -match "LNK\d+" -or $l -match "MSB\d+" -or $l -match "ninja error" -or $l -match "assertion" -or $l -match "Exception") {
                $allErr += $l
              }
            }
          }
          if ($allErr.Count -eq 0) {
            $allErr = @("无匹配错误行 —— 请检查 CMakeError.log / cpp_build.log 全文（artifact 里）")
          }
          $n = 0
          foreach ($l in $allErr) {
            $esc = ("$l").Trim() -replace "%", "%25" -replace "\r", "" -replace "\n", "%0A"
            if ($esc.Length -gt 600) { $esc = $esc.Substring(0, 600) }
            Write-Output "::error title=PC diag ${phase}::${esc}"
            $n++
            if ($n -ge 10) { break }
          }
          # 错误行没匹配到时（裸 exit 1 场景）：把两个 log 的尾部原样当错误发
          if ($n -eq 0) {
            Write-Output "::error title=PC diag ${phase} (no pattern match)::CMakeError.log tail 60 (exit 1 裸报)"
            $n = 1
            foreach ($l in $cmakeErr) {
              $esc = ("$l").Trim() -replace "%", "%25" -replace "\r", "" -replace "\n", "%0A"
              if ($esc.Length -gt 600) { $esc = $esc.Substring(0, 600) }
              Write-Output "::error title=PC diag ${phase}::${esc}"
              $n++
              if ($n -ge 10) { break }
            }
          }
          $sum = @()
          $sum += "### PC 构建诊断 · phase = $phase"
          $sum += ""
          $sum += '```'
          $sum += (Get-Content toolchain.txt -ErrorAction SilentlyContinue)
          $sum += '```'
          $sum += "#### CMakeError.log 尾 60 行（CMake 报错原文）"
          $sum += ""
          $sum += '```'
          foreach ($l in $cmakeErr | Select-Object -First 60) { $sum += $l.Trim() }
          $sum += '```'
          $sum += "#### cpp_build.log 尾 30 行（MSBuild 输出）"
          $sum += ""
          $sum += '```'
          foreach ($l in $buildErr | Select-Object -First 30) { $sum += $l.Trim() }
          $sum += '```'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $sum

      # 2026-11-15 增强（run #1882 教训）：cpp_build.log 报错行可能不在 tail 30 里
      #（多 target 编译，错误在日志中段），当时 tail 30 与 CMakeError.log 全都匹配不到，
      # 只剩「Process completed with exit code 1」。所以：全文 grep 错误行进注解（匿名可读），
      # 日志尾部整段推 ci-logs 分支（公开可读，绕过 Actions 日志 API 的 admin 门槛，
      # macos.yml 的 Publish errors on failure 同款链路）。
      - name: Grep full build log errors
        if: always()
        shell: pwsh
        run: |
          if (Test-Path cpp_build.log) {
            $errs = @(Get-Content cpp_build.log | Where-Object {
              $_ -match "error [A-Z]+\d+" -or $_ -match "fatal error" -or $_ -match "LNK\d+" -or $_ -match "MSB\d+" -or $_ -match "error:" -or $_ -match "错误"
            } | Select-Object -First 30)
            Write-Output "::error title=PC diag full-grep count::${($errs | Measure-Object).Count}"
            foreach ($l in $errs) {
              $esc = ("$l").Trim() -replace "%", "%25" -replace "\r", "" -replace "\n", "%0A"
              if ($esc.Length -gt 500) { $esc = $esc.Substring(0, 500) }
              Write-Output "::error::${esc}"
            }
          } else {
            Write-Output "::error title=PC diag full-grep::cpp_build.log 不存在"
          }

      - name: Push full logs to ci-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set +e
          WORK=$(mktemp -d)
          cd "$WORK" || exit 1
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin ci-logs; then
            git checkout -q -B ci-logs FETCH_HEAD
          else
            git checkout -q --orphan ci-logs
          fi
          mkdir -p errors
          [ -f "$GITHUB_WORKSPACE/cpp_build.log" ] && tail -800 "$GITHUB_WORKSPACE/cpp_build.log" > "errors/diag_${GITHUB_RUN_ID}_cppbuild.txt"
          [ -f "$GITHUB_WORKSPACE/build_host/CMakeFiles/CMakeError.log" ] && cp "$GITHUB_WORKSPACE/build_host/CMakeFiles/CMakeError.log" "errors/diag_${GITHUB_RUN_ID}_cmakeerr.txt"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "pc diag errors: run ${GITHUB_RUN_ID}" || exit 0
          git push -q origin HEAD:ci-logs && echo "diag errors -> ci-logs branch"

      - name: Upload diagnosis artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc-diag-log
          path: |
            cpp_build.log
            build_host/CMakeFiles/CMakeError.log
            build_host/CMakeFiles/CMakeOutput.log
            toolchain.txt
            diag_phase.txt
          retention-days: 7
          if-no-files-found: ignore
