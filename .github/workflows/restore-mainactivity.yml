name: Restore and Edit MainActivity
on:
  push:
    branches: [fix/touchpad-button-release]
    paths:
      - '.github/workflows/restore-mainactivity.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/touchpad-button-release
          fetch-depth: 0

      - name: Restore file from merge commit and apply edits
        run: |
          # Restore the correct file from the merge commit
          git show 4e9bbab2:android/app/src/main/java/com/allperiph/ui/MainActivity.kt > android/app/src/main/java/com/allperiph/ui/MainActivity.kt

          FILE="android/app/src/main/java/com/allperiph/ui/MainActivity.kt"

          # 1. Remove副屏 comment
          sed -i 's|// 副屏的悬浮窗授权入口|// 悬浮窗授权入口|g' "$FILE"

          # 2. Remove ACCESS_FINE_LOCATION permission request
          sed -i '/GPS（NmeaSource addNmeaListener）需要 FINE_LOCATION/,/ACCESS_FINE_LOCATION/{d}' "$FILE"
          sed -i '/ACCESS_FINE_LOCATION/d' "$FILE"

          # 3. Remove CAMERA check in buildModuleRows
          sed -i '/拨开摄像头子开关时也要先要相机权限/d' "$FILE"
          sed -i '/m.id == com.allperiph.core.ModuleId.CAMERA/d' "$FILE"

          # 4. Remove CAMERA check in bindActions master switch
          sed -i '/摄像头模块启用时先要相机权限/d' "$FILE"
          sed -i '/AgentController.isEnabled(this, com.allperiph.core.ModuleId.CAMERA))/d' "$FILE"
          sed -i '/ensureCameraPermission()/d' "$FILE"

          # 5. Remove ensureCameraPermission() method
          sed -i '/请求 CAMERA 运行时权限/,/^    }/d' "$FILE"

          # 6. Remove REQ_CAMERA constant and Camera case
          sed -i '/REQ_CAMERA/d' "$FILE"
          sed -i '/授权成功且服务已在跑/,/摄像头模块已启动/d' "$FILE"
          sed -i '/AgentController.setModuleEnabled(this, com.allperiph.core.ModuleId.CAMERA/d' "$FILE"

          echo "=== Verification: should be empty ==="
          grep -n 'ModuleId.CAMERA\|REQ_CAMERA\|ensureCameraPermission\|ACCESS_FINE_LOCATION\|副屏' "$FILE" || echo "Clean!"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android/app/src/main/java/com/allperiph/ui/MainActivity.kt
          git commit -m "fix: restore MainActivity.kt and remove Camera/GPS references" || echo "No changes"
          git push