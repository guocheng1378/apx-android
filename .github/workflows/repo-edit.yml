name: repo-edit

# 大文件锚点替换编辑器：MainActivity.kt（~111KB）等无法整文件回传时，
# 把小而精确的改动交给 Actions 云端执行。编辑内容在 .github/scripts/repo_edit.py，
# 每个锚点断言唯一命中，不匹配则本步骤失败 → 不产生提交。

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "提交信息"
        required: true
        default: "chore: repo edit"

jobs:
  edit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # 推完提交要能再 workflow_dispatch 点一次 Build
    steps:
      - uses: actions/checkout@v4
      # 失败时把脚本输出打进 annotations（行动日志 API 拿不到正文，
      # 但 annotations 能用 check-runs API 读回来 —— 云端锚点校验失败必须能定位到第几条）。
      - name: apply edits
        run: |
          set +e
          # F16 锚点热修（run #111 失败原因）：使用说明里防火墙那段是纯文本、
          # 无 ** 加粗，脚本内锚还停在旧加粗版 → count=0。锚与替换串都改成
          # 按原文字段定位，替换后文本与该段行文一致。
          python3 - <<'PY'
          p = ".github/scripts/repo_edit.py"
          s = open(p, encoding="utf-8").read()
          pairs = [
              ('"anchor": "**放行 9501/9502/9511/9512**"',
               '"anchor": "（`AllPeriph apxdesktop ctrl`，放行 9501/9502/9511/9512；"'),
              ('"new": "**放行 9501/9502/9511/9512 及互传 53317（program 级全端口规则；v223.29.32 起规则名升版 v2 强制重建）**"',
               '"new": "（`AllPeriph apxdesktop ctrl v2`，放行 9501/9502/9511/9512 及互传 53317（program 级全端口规则；v223.29.32 起规则名升版 v2 强制重建）；"'),
          ]
          for a, b in pairs:
              if a not in s:
                  print("F16 patch miss: " + a[:60])
                  raise SystemExit(2)
              s = s.replace(a, b, 1)
          open(p, "w", encoding="utf-8").write(s)
          print("F16 anchor patched")
          PY
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::error::F16 anchor patch failed rc=$RC"
            exit $RC
          fi
          OUT=$(python3 .github/scripts/repo_edit.py 2>&1)
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "$OUT"
            MSG=$(echo "$OUT" | tr '\n' '|' | cut -c1-800)
            echo "::error::apply edits failed rc=$RC :: $MSG"
            exit 1
          fi
          echo "$OUT"
      - name: commit and push
        id: commit
        env:
          COMMIT_MSG: ${{ inputs.commit_message }}
        run: |
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"

          # GITHUB_TOKEN 推出来的提交**不会**触发 push 事件的其它工作流（GitHub 防递归），
          # 但 workflow_dispatch 是明文例外 —— 所以这里显式再点一次 Build。
          # 不加这步的后果实测过：repo-edit / 云端 AI 写进去的代码永远没人编译，
          # 批 S-1 的编译错误就是这么在 master 上躺着的。
      - name: trigger Build workflow
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref master
