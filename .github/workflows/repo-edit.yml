name: repo-edit

# 大文件锚点替换编辑器：MainActivity.kt（~111KB）等无法整文件回传时，
# 把小而精确的改动交给 Actions 云端执行。编辑内容在 .github/scripts/repo_edit.py，
# 每个锚点断言唯一命中，不匹配则本步骤失败 → 不产生提交。
# 热修补丁规则（血泪教训，实测 #113/#114）：
#   1) 必须幂等：git add -A 会把补丁后的文件提交进仓库，非幂等补丁下轮秒挂；
#   2) 改了被编辑文件的内容，必须同步改 repo_edit.py 里对应的 anchor/new ——
#      否则脚本的 `new in base` 幂等判断失效，会再插一份（#114 就是这么重复插的）。

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "提交信息"
        required: true
        default: "chore: repo edit"

jobs:
  edit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # 推完提交要能再 workflow_dispatch 点一次 Build
    steps:
      - uses: actions/checkout@v4
      # 失败时把脚本输出打进 annotations（行动日志 API 拿不到正文，
      # 但 annotations 能用 check-runs API 读回来 —— 云端锚点校验失败必须能定位到第几条）。
      - name: apply edits
        run: |
          set +e
          # ---- 1) F16 锚点热修（幂等）----
          # 使用说明里防火墙那段是纯文本、无 ** 加粗，脚本内锚停在旧加粗版 → count=0。
          python3 - <<'PY'
          p = ".github/scripts/repo_edit.py"
          s = open(p, encoding="utf-8").read()
          pairs = [
              ('"anchor": "**放行 9501/9502/9511/9512**"',
               '"anchor": "（`AllPeriph apxdesktop ctrl`，放行 9501/9502/9511/9512；"'),
              ('"new": "**放行 9501/9502/9511/9512 及互传 53317（program 级全端口规则；v223.29.32 起规则名升版 v2 强制重建）**"',
               '"new": "（`AllPeriph apxdesktop ctrl v2`，放行 9501/9502/9511/9512 及互传 53317（program 级全端口规则；v223.29.32 起规则名升版 v2 强制重建）；"'),
          ]
          changed = False
          for a, b in pairs:
              if a in s:
                  s = s.replace(a, b, 1)
                  changed = True
              elif b not in s:
                  print("F16 patch miss: " + a[:60])
                  raise SystemExit(2)
          if changed:
              open(p, "w", encoding="utf-8").write(s)
              print("F16 anchor patched")
          else:
              print("F16 anchor already patched, skip")
          PY
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::error::F16 anchor patch failed rc=$RC"
            exit $RC
          fi
          # ---- 2) F12 的 new 同步 reinterpret_cast（幂等）----
          # Build #1460/#1461：ShellExecuteA 返回 HINSTANCE（指针），
          # static_cast 指针→整型不合法 → C2440 + C2737。脚本里 F12 的 new
          # 必须与文件最终态一致，否则 `new in base` 判未应用 → 重复插入（#114 根因）。
          python3 - <<'PY2'
          p = ".github/scripts/repo_edit.py"
          s = open(p, encoding="utf-8").read()
          old = "static_cast<INT_PTR>(::ShellExecuteA"
          new = "reinterpret_cast<INT_PTR>(::ShellExecuteA"
          n = s.count(old)
          if n == 1:
              open(p, "w", encoding="utf-8").write(s.replace(old, new, 1))
              print("F12 new -> reinterpret_cast")
          elif n == 0 and new in s:
              print("F12 already reinterpret, skip")
          else:
              print("F12 patch ambiguous n=%d" % n)
              raise SystemExit(5)
          PY2
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::error::F12 reinterpret patch failed rc=$RC"
            exit $RC
          fi
          # ---- 3) action_router.cpp 去重 + reinterpret（幂等）----
          # #114 热修先改了文件、脚本 new 判未应用又插了一份 → 现在两份 update 块。
          # 保留第一份（已是 reinterpret），删掉后面重复的，再兕底改掉残留 static_cast。
          python3 - <<'PY3'
          p = "pc/host/src/api/action_router.cpp"
          s = open(p, encoding="utf-8").read()
          M = "    // ---- 在线更新（v223.29.32）"
          D = "    // ---- 诊断 ----"
          c = s.count(M)
          changed = False
          if c >= 2:
              i2 = s.find(M, s.find(M) + len(M))
              e2 = s.find(D, i2)
              if e2 < 0:
                  print("diag marker not found after duplicate block")
                  raise SystemExit(6)
              s = s[:i2] + s[e2:]
              changed = True
              print("removed duplicate update block (count=%d)" % c)
          elif c != 1:
              print("update block count=%d expect=1" % c)
              raise SystemExit(6)
          olds = "static_cast<INT_PTR>(::ShellExecuteA"
          news = "reinterpret_cast<INT_PTR>(::ShellExecuteA"
          n = s.count(olds)
          if n == 1:
              s = s.replace(olds, news, 1)
              changed = True
              print("action_router static->reinterpret")
          elif n > 1:
              print("ambiguous static_cast n=%d" % n)
              raise SystemExit(6)
          if changed:
              open(p, "w", encoding="utf-8").write(s)
          else:
              print("action_router already clean, skip")
          PY3
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::error::action_router dedup patch failed rc=$RC"
            exit $RC
          fi
          OUT=$(python3 .github/scripts/repo_edit.py 2>&1)
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "$OUT"
            MSG=$(echo "$OUT" | tr '\n' '|' | cut -c1-800)
            echo "::error::apply edits failed rc=$RC :: $MSG"
            exit 1
          fi
          echo "$OUT"
      - name: commit and push
        id: commit
        env:
          COMMIT_MSG: ${{ inputs.commit_message }}
        run: |
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"

          # GITHUB_TOKEN 推出来的提交**不会**触发 push 事件的其它工作流（GitHub 防递归），
          # 但 workflow_dispatch 是明文例外 —— 所以这里显式再点一次 Build。
          # 不加这步的后果实测过：repo-edit / 云端 AI 写进去的代码永远没人编译，
          # 批 S-1 的编译错误就是这么在 master 上躺着的。
      - name: trigger Build workflow
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref master
