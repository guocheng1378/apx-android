name: repo-edit

# 大文件锚点替换编辑器：MainActivity.kt（~111KB）等无法整文件回传时，
# 把小而精确的改动交给 Actions 云端执行。编辑内容在 .github/scripts/repo_edit.py，
# 每个锚点断言唯一命中，不匹配则本步骤失败 → 不产生提交。
# 注意：本文件里的热修补丁都是幂等的（原文在则改，已是改后态则跳过）——
# git add -A 会把补丁后的脚本提交进仓库，非幂等补丁会在下一次 run 秒挂（实测 #113）。

on:
  workflow_dispatch:
    inputs:
      commit_message:
        description: "提交信息"
        required: true
        default: "chore: repo edit"

jobs:
  edit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # 推完提交要能再 workflow_dispatch 点一次 Build
    steps:
      - uses: actions/checkout@v4
      # 失败时把脚本输出打进 annotations（行动日志 API 拿不到正文，
      # 但 annotations 能用 check-runs API 读回来 —— 云端锚点校验失败必须能定位到第几条）。
      - name: apply edits
        run: |
          set +e
          # ---- F16 锚点热修（幂等）----
          # 使用说明里防火墙那段是纯文本、无 ** 加粗，脚本内锚停在旧加粗版 → count=0。
          python3 - <<'PY'
          p = ".github/scripts/repo_edit.py"
          s = open(p, encoding="utf-8").read()
          pairs = [
              ('"anchor": "**放行 9501/9502/9511/9512**"',
               '"anchor": "（`AllPeriph apxdesktop ctrl`，放行 9501/9502/9511/9512；"'),
              ('"new": "**放行 9501/9502/9511/9512 及互传 53317（program 级全端口规则；v223.29.32 起规则名升版 v2 强制重建）**"',
               '"new": "（`AllPeriph apxdesktop ctrl v2`，放行 9501/9502/9511/9512 及互传 53317（program 级全端口规则；v223.29.32 起规则名升版 v2 强制重建）；"'),
          ]
          changed = False
          for a, b in pairs:
              if a in s:
                  s = s.replace(a, b, 1)
                  changed = True
              elif b not in s:
                  print("F16 patch miss: " + a[:60])
                  raise SystemExit(2)
          if changed:
              open(p, "w", encoding="utf-8").write(s)
              print("F16 anchor patched")
          else:
              print("F16 anchor already patched, skip")
          PY
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::error::F16 anchor patch failed rc=$RC"
            exit $RC
          fi
          # ---- action_router.cpp reinterpret_cast 热修（幂等）----
          # Build #1460 失败：update.open 分支 static_cast<INT_PTR>(::ShellExecuteA(...))，
          # ShellExecuteA 返回 HINSTANCE（指针），C++ 不允许 static_cast 指针→整型 → C2440 + C2737 连锁。
          python3 - <<'PY2'
          p = "pc/host/src/api/action_router.cpp"
          s = open(p, encoding="utf-8").read()
          olds = "const bool did = static_cast<INT_PTR>(::ShellExecuteA("
          news = "const bool did = reinterpret_cast<INT_PTR>(::ShellExecuteA("
          if olds in s:
              if s.count(olds) != 1:
                  print("action_router patch ambiguous count=%d" % s.count(olds))
                  raise SystemExit(3)
              open(p, "w", encoding="utf-8").write(s.replace(olds, news, 1))
              print("action_router.cpp reinterpret_cast patched")
          elif news not in s:
              print("action_router patch miss: neither old nor new form found")
              raise SystemExit(3)
          else:
              print("action_router.cpp already patched, skip")
          PY2
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::error::action_router patch failed rc=$RC"
            exit $RC
          fi
          OUT=$(python3 .github/scripts/repo_edit.py 2>&1)
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "$OUT"
            MSG=$(echo "$OUT" | tr '\n' '|' | cut -c1-800)
            echo "::error::apply edits failed rc=$RC :: $MSG"
            exit 1
          fi
          echo "$OUT"
      - name: commit and push
        id: commit
        env:
          COMMIT_MSG: ${{ inputs.commit_message }}
        run: |
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "$COMMIT_MSG"
          git push
          echo "pushed=1" >> "$GITHUB_OUTPUT"

          # GITHUB_TOKEN 推出来的提交**不会**触发 push 事件的其它工作流（GitHub 防递归），
          # 但 workflow_dispatch 是明文例外 —— 所以这里显式再点一次 Build。
          # 不加这步的后果实测过：repo-edit / 云端 AI 写进去的代码永远没人编译，
          # 批 S-1 的编译错误就是这么在 master 上躺着的。
      - name: trigger Build workflow
        if: steps.commit.outputs.pushed == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref master
