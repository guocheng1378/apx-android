name: RGB Fix

# b27——修「这是坏的」两个真问题（成宇 2026-11-08）：
# ① Build #1407 红：check_appearance 判据6 —— ui/ 下 Color(0x…) 字面量判红（b25 引入的
#    黑键帽 0xFF0C0C0C，b26 又写了一处）；改为语义令牌 R.color.keycap_rgb_black（colors.xml）。
# ② 按下扩散档功能冻死：Touch 分支的 touchFg / drawBehind 都没订阅相位，键框只在按下那刻
#    重绘一帧就停，涟漪跑不起来；两处补 rgb.phase?.value 订阅（绘制阶段读 → 逐帧重绘）。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply b27 fixes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, sys
          fails = []

          def rep(text, old, new, tag, count=1):
              n = text.count(old)
              if n != count:
                  fails.append(tag + ": count=" + str(n) + " expect=" + str(count))
                  return text
              return text.replace(old, new, count)

          P = "android/app/src/main/java/com/allperiph/ui/compose/KeyboardPage.kt"
          text = open(P, encoding="utf-8").read()

          # E-a 黑键帽改语义令牌
          OLD_A = "    // 键面：相位在 drawBehind 里读，动画只触发重绘不重组；灯效关 → 原样 background。"
          NEW_A = (
          "    // 键面：相位在 drawBehind 里读，动画只触发重绘不重组；灯效关 → 原样 background。\n"
          "    // 黑键帽走语义令牌（check_appearance 判据6：ui/ 下禁止字面色值）\n"
          "    val rgbCap = Color(host.context.getColor(R.color.keycap_rgb_black))"
          )
          text = rep(text, OLD_A, NEW_A, "A rgbCap decl")

          # E-b 两处字面量 → rgbCap
          OLD_B = "drawRect(color = Color(0xFF0C0C0C), topLeft = tl, size = cap)"
          n = text.count(OLD_B)
          if n != 2:
              fails.append("B literal count=" + str(n) + " expect=2")
          else:
              text = text.replace(OLD_B, "drawRect(color = rgbCap, topLeft = tl, size = cap)")

          # E-c touchFg 订阅相位（每帧重组，字符随涟漪亮）
          OLD_C = (
          "    fun touchFg(): Color {\n"
          "        val l = touchLight()\n"
          "        return if (l.alpha > 0f) l else MiuixTheme.colorScheme.onSurface\n"
          "    }\n"
          )
          NEW_C = (
          "    fun touchFg(): Color {\n"
          "        val tick = rgb.phase?.value ?: 0f // 订阅相位 → 每帧重组；不订阅会冻在按下那一帧\n"
          "        val l = touchLight()\n"
          "        return if (l.alpha > 0f) l else MiuixTheme.colorScheme.onSurface\n"
          "    }\n"
          )
          text = rep(text, OLD_C, NEW_C, "C touchFg phase")

          # E-d draw 阶段订阅相位（每帧重绘，涟漪逐帧推进）
          OLD_D = (
          "                if (rgb.mode == KeyPref.RGB_TOUCH) {\n"
          "                    drawRect(color = bg) // 按下扩散档平时保持普通键面\n"
          )
          NEW_D = (
          "                if (rgb.mode == KeyPref.RGB_TOUCH) {\n"
          "                    val tick = rgb.phase?.value ?: 0f // 绘制阶段订阅相位 → 逐帧重绘，涟漪推进\n"
          "                    drawRect(color = bg) // 按下扩散档平时保持普通键面\n"
          )
          text = rep(text, OLD_D, NEW_D, "D draw phase")

          if "Color(0xFF0C0C0C" in text:
              fails.append("leftover hex literal")
          if text.count("rgbCap") < 3:
              fails.append("rgbCap refs=" + str(text.count("rgbCap")))
          if not fails:
              open(P, "w", encoding="utf-8").write(text)

          # colors.xml 语义令牌
          P2 = "android/app/src/main/res/values/colors.xml"
          t2 = open(P2, encoding="utf-8").read()
          if "keycap_rgb_black" not in t2:
              if t2.count("</resources>") != 1:
                  fails.append("colors end-tag count=" + str(t2.count("</resources>")))
              else:
                  m = re.search(r"\n([ \t]*)<color ", t2)
                  ind = m.group(1) if m else "    "
                  t2 = t2.replace(
                      "</resources>",
                      ind + '<color name="keycap_rgb_black">#FF0C0C0C</color>\n</resources>',
                      1,
                  )
                  open(P2, "w", encoding="utf-8").write(t2)

          if fails:
              print("ERRORS:\n" + "\n".join(fails))
              sys.exit(1)
          print("OK: b27 applied (keycap token + touch phase subscription)")
          PY
      - name: commit and push
        run: |
          set -euo pipefail
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "fix: b27 — 黑键帽改语义令牌 keycap_rgb_black（过外观门面判据6）+ Touch 档订阅相位修涟漪冻结（成宇「这是坏的」）"
          git push
