name: RGB Fix

# b30——修 :app:compileReleaseKotlin 唯一 2 错（Build #1411 注解实证）：
# KeyboardPage touchFg 是普通局部函数，内部取 MiuixTheme.colorScheme（@Composable 上下文依赖），
# 734:9「Functions which invoke @Composable must be marked @Composable」+ 737:52。
# 修复：touchFg 加 @Composable（在 KeyBox 组合期调用，合法）。其余门禁已全绿。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply b30
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, traceback
          LOG = "docs/edit_error.log"
          fails = []
          try:
              P = "android/app/src/main/java/com/allperiph/ui/compose/KeyboardPage.kt"
              text = open(P, encoding="utf-8").read()
              OLD = (
              "    fun touchFg(): Color {\n"
              "        val tick = rgb.phase?.value ?: 0f // 订阅相位 → 每帧重组；不订阅会冻在按下那一帧\n"
              )
              NEW = (
              "    @Composable\n"
              "    fun touchFg(): Color {\n"
              "        val tick = rgb.phase?.value ?: 0f // 订阅相位 → 每帧重组；不订阅会冻在按下那一帧\n"
              )
              n = text.count(OLD)
              if n != 1:
                  fails.append("touchFg anchor count=" + str(n))
              else:
                  text = text.replace(OLD, NEW, 1)
              if "@Composable\n    fun touchFg" not in text:
                  fails.append("composable marker missing")
              if not fails:
                  open(P, "w", encoding="utf-8").write(text)
          except Exception:
              fails.append("EXCEPTION:\n" + traceback.format_exc())
          if fails:
              body = "ERRORS:\n" + "\n".join(fails) + "\n"
              os.makedirs("docs", exist_ok=True)
              open(LOG, "w", encoding="utf-8").write(body)
              print(body)
              sys.exit(1)
          if os.path.exists(LOG):
              os.remove(LOG)
          print("OK: b30 applied")
          PY
      - name: commit and push
        run: |
          set -euo pipefail
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "fix: b30 — touchFg 加 @Composable（修 compileReleaseKotlin 唯一 2 错）"
          git push
      - name: commit error log
        if: always()
        run: |
          set +e
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add docs/edit_error.log 2>/dev/null
          git diff --cached --quiet && exit 0
          git commit -m "chore: b30 诊断日志"
          git push
