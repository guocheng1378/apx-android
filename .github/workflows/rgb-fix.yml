name: RGB Fix

# b31——修 Build #1412 Android 6 处「Fixable lint warnings」（@Composable 重复声明）：
# 重复的 @Composable/局部 composable 声明是 lint 警告（Fixable），Kotlin 规范更推荐
# 抽成顶层的 @Composable @Stable 标记（@Stable 让跨组合调用时 lambda 重绘行为稳定）。
# 6 处都在 KeyBox 的 rgbFace / touchLight / touchFg / 涟漪相关局部函数上（b28 引入时
# 逐处手写 @Composable 所致）。修复：抽顶层标记，局部函数去重 @Composable。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply b31
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, traceback
          LOG = "docs/edit_error.log"
          fails = []
          try:
              P = "android/app/src/main/java/com/allperiph/ui/compose/KeyboardPage.kt"
              text = open(P, encoding="utf-8").read()

              # 顶层标记：@Stable 放在 @Composable 之前（Kotlin 约定）
              TOP = "@Composable\n@Stable\n"
              if TOP not in text:
                  fails.append("top marker missing")
              else:
                  text = text.replace(TOP, "@Stable\n@Composable\n", 1)

              # 去重复：所有 "\n    @Composable\n    fun" 的 @Composable 头删掉
              old = "\n    @Composable\n    fun"
              n = text.count(old)
              if n != 6:
                  fails.append("dup @Composable count=" + str(n) + " expect=6")
              else:
                  text = text.replace(old, "\n    fun", n)

              if "\n    @Composable\n    fun" in text:
                  fails.append("leftover dup @Composable")
              if not fails:
                  open(P, "w", encoding="utf-8").write(text)
          except Exception:
              fails.append("EXCEPTION:\n" + traceback.format_exc())
          if fails:
              body = "ERRORS:\n" + "\n".join(fails) + "\n"
              os.makedirs("docs", exist_ok=True)
              open(LOG, "w", encoding="utf-8").write(body)
              print(body)
              sys.exit(1)
          if os.path.exists(LOG):
              os.remove(LOG)
          print("OK: b31 applied")
          PY
      - name: commit and push
        run: |
          set -euo pipefail
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "fix: b31 — 抽 @Composable @Stable 顶层标记，删 6 处重复声明（lint Fixable warnings）"
          git push
      - name: commit error log
        if: always()
        run: |
          set +e
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add docs/edit_error.log 2>/dev/null
          git diff --cached --quiet && exit 0
          git commit -m "chore: b31 诊断日志"
          git push
