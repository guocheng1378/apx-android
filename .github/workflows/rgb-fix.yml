name: RGB Fix

# b32v2——CHANGELOG 插入 v223.29.29 段（发版正文的真源）：
# build.yml 的 release job 从 docs/CHANGELOG.md 里截 `## <tag>` 段当 Release 正文，
# 没有该段会降级成「明细缺失」占位。锚点取文件里第一个 "\n## v"（第一节位置），
# 幂等：已插入则不写盘。成功后删 b31 留下的 docs/edit_error.log。
# 注意：多行文案必须写成逐行字符串列表——三引号原文直接放在 run: | 块里会顶到
# 行首（0 缩进）把 YAML literal block 截断，整个工作流解析失败（b32v1 教训）。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply b32
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, traceback
          LOG = "docs/edit_error.log"
          fails = []
          P = "docs/CHANGELOG.md"
          TAG = "## v223.29.29（2026-11-08）"
          LINES = [
              "## v223.29.29（2026-11-08）",
              "",
              "键盘 RGB 灯效批次 b24–b30 收口（成宇「是要真的」连续反馈），Build #1414 全绿。",
              "",
              "### 灯效对齐真键盘（b24）",
              "",
              "- 呼吸模式改 48s 相位 + 正弦明灭：根治旧版循环末尾的快闪；波浪/呼吸的饱和与明度拉到 LED 级配色，不再发灰。",
              "",
              "### 真键盘渲染（b25）",
              "",
              "- KeyBox 按透光键帽发光结构复刻：键缝泛光 + 黑键帽 + 亮边 + 字符透光，键盘从平面色块变成一把有灯的真键盘。",
              "",
              "### 按下扩散第 4 档 + Touch 相位修复（b26/b27/b29）",
              "",
              "- 按下扩散新增 Reactive 涟漪档：按下处向外扩散的圆环涟漪，四档齐全（关闭/呼吸/波浪/按下）。",
              "- Touch 档相位改即时订阅：切档立即生效；KeyBox 字面色值全部走主题令牌，换肤/莫奈/深色下灯效跟随，不再有死色。",
              "",
              "### 修复与 CI",
              "",
              "- `touchFg` 补 `@Composable`（b30）：清掉 `compileReleaseKotlin` 仅剩 2 处编译错，Build 恢复全绿（#1414）。",
              "- RGB Fix 机器人 b24–b31：锚点实况校验 + 自诊断日志（docs/edit_error.log），编辑失败定位到行；新增 Fix Release Notes 工作流补全占位正文。",
              "",
              "---",
          ]
          SECTION = "\n".join(LINES)
          try:
              text = open(P, encoding="utf-8").read()
              if TAG in text:
                  print("OK: section already present, skip")
                  sys.exit(0)
              idx = text.find("\n## v")
              if idx < 0:
                  fails.append("anchor \\n## v not found")
              else:
                  text = text[: idx + 1] + SECTION + "\n" + text[idx + 1 :]
                  if TAG not in text:
                      fails.append("insert verification failed")
                  else:
                      open(P, "w", encoding="utf-8").write(text)
                      if os.path.exists(LOG):
                          os.remove(LOG)
                      print("OK: inserted v223.29.29 section")
          except Exception:
              fails.append("EXCEPTION:\n" + traceback.format_exc())
          if fails:
              body = "ERRORS:\n" + "\n".join(fails) + "\n"
              os.makedirs("docs", exist_ok=True)
              open(LOG, "w", encoding="utf-8").write(body)
              print(body)
              sys.exit(1)
          PY
      - name: commit and push
        run: |
          set -euo pipefail
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "docs: CHANGELOG 补 v223.29.29 段（发版正文，灯效批次 b24–b30）"
          git push
      - name: commit error log
        if: always()
        run: |
          set +e
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add docs/edit_error.log 2>/dev/null
          git diff --cached --quiet && exit 0
          git commit -m "chore: b32 诊断日志"
          git push
