name: RGB Fix

# b33v2——修用户反馈两个视觉问题（键盘页 KeyBox 灯效），同 b33，仅修 comment 锚：
#   1) 「有时看不见键盘了」：呼吸暗谷 v=0.05（每 4s 一次）→ 地板抬到 0.30；
#   2) 「rgb 没有渐变」：呼吸档全键盘同色 → 按横坐标错相成彩虹 + 键内导光渐变。
# v2 教训：双行 comment 锚丢了文件里的 4 空格缩进（count=0），改为两条带缩进的单行锚。
# 编辑完自动触发 Build 验编译（workflow_dispatch 是 GITHUB_TOKEN 递归限制的例外）。

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apply b33v2
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys, traceback
          LOG = "docs/edit_error.log"
          fails = []
          P = "android/app/src/main/java/com/allperiph/ui/compose/KeyboardPage.kt"
          text = open(P, encoding="utf-8").read()
          def rep(tag, old, new):
              global text
              if new in text and old not in text:
                  print("SKIP " + tag)
                  return
              n = text.count(old)
              if n != 1:
                  fails.append(tag + " anchor count=" + str(n) + " expect=" + old[:40])
                  return
              text = text.replace(old, new, 1)
          try:
              rep("import",
                  "import androidx.compose.ui.graphics.Color",
                  "import androidx.compose.ui.graphics.Brush\nimport androidx.compose.ui.graphics.Color")
              rep("comment1",
                  "    // 波浪档按**横坐标**错相（列状彩虹）：落位时记一次 x；只在波浪档挂监听，",
                  "    // 按**横坐标**错相（列状彩虹）：落位时记一次 x；三档都挂监听——b33 起呼吸档也错相")
              rep("comment2",
                  "    // 呼吸档全键盘同色不需要位置。取 boundsInWindow（本仓 Compose 版本无 positionInRoot，",
                  "    // （修「rgb 没有渐变」：不再全键盘同色）。取 boundsInWindow（本仓 Compose 版本无 positionInRoot，")
              rep("km-cond",
                  "        if (rgbOn &&\n            (rgb.mode == KeyPref.RGB_WAVE || rgb.mode == KeyPref.RGB_TOUCH)\n        ) {",
                  "        if (rgbOn) {")
              rep("rgbFace",
                  "        val h = if (breathe) p else p + rgbX * 0.6f\n        val v = if (breathe) 0.05f + 0.90f * env else 0.95f",
                  "        // b33：呼吸暗谷从 0.05 抬到 0.30——暗谷里黑键帽/描边/字全灭，整副键盘消失\n        // （「有时看不见键盘了」）；呼吸档按横坐标错相成彩虹随呼吸明灭（修「没有渐变」）。\n        val h = p + rgbX * (if (breathe) 0.35f else 0.6f)\n        val v = if (breathe) 0.30f + 0.65f * env else 0.95f")
              rep("gradient",
                  "                } else {\n                    val light = rgbFace(1f)\n                    val inset = 3.dp.toPx()\n                    val tl = Offset(inset, inset)\n                    val cap = Size(size.width - inset * 2, size.height - inset * 2)\n                    drawRect(color = light)\n                    drawRect(color = rgbCap, topLeft = tl, size = cap)\n                    drawRect(color = light, topLeft = tl, size = cap, style = Stroke(2.dp.toPx()))\n                }",
                  "                } else {\n                    val light = rgbFace(1f)\n                    val inset = 3.dp.toPx()\n                    val tl = Offset(inset, inset)\n                    val cap = Size(size.width - inset * 2, size.height - inset * 2)\n                    // b33 键内渐变：导光面底亮顶暗 + 同色渐变描边（真键盘导光板观感）\n                    val grad = Brush.verticalGradient(0f to light, 1f to light.copy(alpha = 0.45f))\n                    drawRect(brush = grad)\n                    drawRect(color = rgbCap, topLeft = tl, size = cap)\n                    drawRect(brush = grad, topLeft = tl, size = cap, style = Stroke(2.dp.toPx()))\n                }")
              if "0.05f + 0.90f" in text:
                  fails.append("old breath floor still present")
              if "verticalGradient" not in text:
                  fails.append("gradient missing")
              if not fails:
                  open(P, "w", encoding="utf-8").write(text)
                  if os.path.exists(LOG):
                      os.remove(LOG)
                  print("OK: b33v2 applied")
          except Exception:
              fails.append("EXCEPTION:\n" + traceback.format_exc())
          if fails:
              body = "ERRORS:\n" + "\n".join(fails) + "\n"
              os.makedirs("docs", exist_ok=True)
              open(LOG, "w", encoding="utf-8").write(body)
              print(body)
              sys.exit(1)
          PY
      - name: commit and push
        run: |
          set -euo pipefail
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "fix: b33 — 灯效修「无渐变/看不见键盘」：呼吸彩虹错相 + 暗谷 0.30 地板 + 键内导光渐变"
          git push
      - name: trigger build
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
            -d '{"ref":"master"}' && echo "build dispatched"
      - name: commit error log
        if: always()
        run: |
          set +e
          git config user.name "repo-edit[bot]"
          git config user.email "106110000+repo-edit[bot]@users.noreply.github.com"
          git add docs/edit_error.log 2>/dev/null
          git diff --cached --quiet && exit 0
          git commit -m "chore: b33v2 诊断日志"
          git push
