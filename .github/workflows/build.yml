name: Build

# 触发：
#   push master        —— 只做构建验证（Android + PC），不发 release
#   push tag v*        —— 构建三端产物并自动创建 GitHub Release
#   pull_request→master—— PR 上先构建验证，编译错误在合入前拦下
#   workflow_dispatch  —— 手动构建验证
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# Windows runner 默认 30GB SSD + 14GB RAM —— 拉 WebView2 SDK + wil FetchContent + node_modules
# 都吃磁盘，预留足够空间。另外 FetchContent 超时长的话 runner 会被回收，显式设 timeout。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------ Android（手机 + TV）
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK + NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APKs (app + tv)
        run: ./gradlew :app:assembleRelease :tv:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; echo "EXIT_CODE=$PIPESTATUS" && exit $PIPESTATUS
        shell: bash

      - name: Show build errors
        if: failure()
        run: |
          echo "========== BUILD FAILED =========="
          grep -n -A 5 -i "error:" /tmp/build.log 2>/dev/null || true
          echo "========== LAST 80 LINES =========="
          tail -80 /tmp/build.log 2>/dev/null || true

      - name: Protocol unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tail -50
        shell: bash

      - name: Static analysis (Android Lint, non-blocking)
        continue-on-error: true
        run: ./gradlew :app:lintRelease :tv:lintRelease --no-daemon 2>&1 | tail -40

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-release.html
            tv/build/reports/lint-results-release.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload app APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-app
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload tv APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-tv
          path: android/tv/build/outputs/apk/release/tv-release.apk
          retention-days: 14

  # ------------------------------------------------ PC（Windows 三件套 + WebView2 前端）
  pc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Node 20 —— 前端 React + Tailwind 构建需要
      # Windows runner 默认装了 Node 20，但显式 pin 版本避免浮动
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pc/web/package-lock.json

      # MSVC x64 —— 桌面端 C++ 原生编译
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Windows runner 默认 CMake 版本可能偏低；3.22+ 保险起见
      - name: Upgrade CMake
        shell: pwsh
        run: |
          $ver = (cmake --version | Select-String -Pattern '^cmake version (\d+\.\d+\.\d+)').Matches.Groups[1].Value
          Write-Host "current cmake: $ver"
          if ([version]$ver -lt [version]'3.22.0') {
            Write-Host "cmake too old -> installing via winget"
            winget install Kitware.CMake --accept-package-agreements --accept-source-agreements
          } else {
            Write-Host "cmake OK: $ver"
          }

      # --- 前端：npm install + npm run build ---
      # CMake 的 FetchContent + Fetch npm 是并行的；先装 node 依赖让缓存生效
      - name: Install web dependencies
        shell: pwsh
        working-directory: pc/web
        run: |
          npm ci --no-audit --no-fund 2>&1 | Select-Object -Last 10

      - name: Build frontend (Vite + React + Tailwind)
        shell: pwsh
        working-directory: pc/web
        run: |
          npm run build 2>&1 | Tee-Object -FilePath /tmp/web_build.log | Select-Object -Last 20
          if ($LASTEXITCODE -ne 0) { Get-Content /tmp/web_build.log -Tail 40; exit $LASTEXITCODE }

      # --- CMake Configure ---
      # APXPC_BUILD_UI=ON + APXPC_BUILD_UI_WEBVIEW2=ON → 新 WebView2 面板
      # FetchContent 会拉：WebView2 C++ SDK（GitHub Release zip，~5MB）+ wil（GitHub repo，~1MB）
      # 两者都走 GitHub，CI 网络可达。显式给 FetchContent 的 timeout。
      - name: Configure (CMake + WebView2 SDK + wil via FetchContent)
        shell: pwsh
        run: |
          cmake -S pc/host -B build_host -G `
            -DAPXPC_BUILD_SDK=OFF `
            -DAPXPC_BUILD_EXAMPLES=OFF `
            -DAPXPC_BUILD_UI=ON `
            -DAPXPC_BUILD_UI_WEBVIEW2=ON `
            -DCMAKE_FETCHCONTENT_FULLY_DISCONNECTED=OFF
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== CMake configure FAILED ==="
            Get-Content build_host/CMakeFiles/CMakeError.log -Tail 50 -ErrorAction SilentlyContinue
            exit 1
          }

      # --- CMake Build ---
      # Post-build step（web_panel.cpp 里配的）会自动把 pc/web/dist/ 拷贝到
      # build_host/Release/apxdesktop/web/，并把 WebView2Loader.dll 拷到 exe 同目录
      - name: Build (apxhost + apxdesktop + apxsetup)
        shell: pwsh
        run: |
          cmake --build build_host --config Release --target apxhost apxdesktop apxsetup 2>&1 | `
            Tee-Object -FilePath /tmp/cpp_build.log | Select-Object -Last 30
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== C++ build FAILED ==="
            Get-Content /tmp/cpp_build.log -Tail 80
            exit $LASTEXITCODE
          }

      # --- Artifacts ---
      - name: Upload PC exes + bundled UI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pc-exes-webview2
          path: |
            build_host/Release/apxhost.exe
            build_host/Release/apxdesktop.exe
            build_host/Release/apxsetup.exe
            build_host/Release/WebView2Loader.dll
            build_host/Release/web/
          retention-days: 14

      - name: Upload web frontend dist (独立，便于调 UI)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: pc/web/dist/
          retention-days: 14

      # --- 失败诊断 ---
      - name: Diagnose on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== CMake configure log ==="
          Get-Content build_host/CMakeFiles/CMakeOutput.log -Tail 30 -ErrorAction SilentlyContinue
          Write-Host "=== CMake error log ==="
          Get-Content build_host/CMakeFiles/CMakeError.log -Tail 60 -ErrorAction SilentlyContinue
          Write-Host "=== WebView2 SDK FetchContent ==="
          Get-ChildItem -Recurse -Path build_host -Filter "*.zip" -ErrorAction SilentlyContinue | Select-Object FullName, Length
          Write-Host "=== npm build log ==="
          Get-Content /tmp/web_build.log -Tail 40 -ErrorAction SilentlyContinue

  # ------------------------------------------------ 静态检查（独立 job，不阻塞）
  lint:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pc/web/package-lock.json

      - name: Generate compile_commands.json
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            Write-Host "ninja not found -> installing via choco"
            choco install ninja -y --no-progress
            $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          }
          if (Test-Path build_tidy) { Remove-Item -Recurse -Force build_tidy }
          # 开启 WebView2 + 前端，确保新文件 web_panel.cpp 也进 compile_commands.json
          cmake -S pc/host -B build_tidy -G Ninja `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DAPXPC_BUILD_SDK=OFF -DAPXPC_BUILD_EXAMPLES=OFF `
            -DAPXPC_BUILD_UI=ON -DAPXPC_BUILD_UI_WEBVIEW2=ON
          if (-not (Test-Path build_tidy/compile_commands.json)) { throw "compile_commands.json 未生成" }

      - name: Locate clang-tidy
        continue-on-error: true
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $t = Get-ChildItem "$vs\VC\Tools\Llvm\x64" -Recurse -Filter clang-tidy.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($t) {
            Write-Host "found bundled clang-tidy: $($t.FullName)"
            $t.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            Write-Host "not bundled -> installing llvm via choco"
            choco install llvm -y --no-progress
          }

      - name: clang-tidy (core modules)
        continue-on-error: true
        shell: cmd
        run: |
          clang-tidy --version
          set "CHECKS=-*,bugprone-*,clang-analyzer-*,performance-*,-bugprone-easily-swappable-parameters"
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\wireless\ctrl9511.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\wireless\input_injector_win.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\media\audio_capture.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\media\mic_bridge.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\media\touch_inject.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\ui\web_panel.cpp

  # ------------------------------------------------ 协议一致性（跨端常量 / 命令号）
  protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 跨端协议一致性校验
        run: python3 scripts/check_protocol.py

  # ------------------------------------------------ Release（仅 tag v*）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, pc]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Rename artifacts with version
        run: |
          VER="${GITHUB_REF_NAME}"
          mkdir -p out
          cp dist/apk-app/app-release.apk                    "out/AllPeriph-${VER}-app-release.apk"
          cp dist/apk-tv/tv-release.apk                      "out/AllPeriph-${VER}-tv-release.apk"
          cp dist/pc-exes-webview2/apxhost.exe               "out/AllPeriph-${VER}-apxhost.exe"
          cp dist/pc-exes-webview2/apxdesktop.exe            "out/AllPeriph-${VER}-apxdesktop.exe"
          cp dist/pc-exes-webview2/apxsetup.exe              "out/AllPeriph-${VER}-apxsetup.exe"
          cp dist/pc-exes-webview2/WebView2Loader.dll        "out/WebView2Loader.dll"
          # 前端产物打包成 zip（Release 附件里目录结构不直观）
          cd dist/pc-exes-webview2 && zip -r "../../out/web-frontend.zip" web/ && cd -
          ls -la out/
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 全能外设 ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
          make_latest: true
          body: |
            ## 全能外设 ${{ github.ref_name }}

            ### PC 端（WebView2 新面板）
            - **apxdesktop.exe** —— 桌面控制面板（内嵌 React + Tailwind UI）
            - **apxhost.exe** —— 仅宿主服务（无 GUI）
            - **apxsetup.exe** —— 安装包
            - **WebView2Loader.dll** —— 与 apxdesktop.exe 同目录（便携场景需要）
            - **web-frontend.zip** —— 前端 dist/（解压到 apxdesktop.exe/web/）

            > Win10 2004+ 与 Win11 已自带 WebView2 Runtime；旧版 Win10 需从 https://aka.ms/webviewruntime 下载安装。
