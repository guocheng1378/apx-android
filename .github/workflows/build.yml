name: Build

# 触发：
#   push master        —— 只做构建验证（Android + PC + 协议 + lint），不发 release
#   push tag v*        —— 构建三端产物并自动创建 GitHub Release
#   pull_request→master—— PR 上先构建验证，编译错误在合入前拦下
#   workflow_dispatch  —— 手动构建验证
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

# ---- Self-Hosted Runner 路由 ----
# 两台 self-hosted runner 都注册在同一个 GitHub repo，runs-on 按 label 选：
#
#   Linux runner（NAS Docker 容器）:  self-hosted + linux + x86_64 + apxpc-linux
#   Windows runner（NAS KVM Win VM）: self-hosted + windows + x64 + apxpc-win
#   Release job:                      继续 ubuntu-latest（只做 artifact 打包 + GitHub Release，
#                                     不触发原生编译，没必要迁 self-hosted）
#
# 为什么不统一用 self-hosted？Release job 里 softprops/action-gh-release 这个 action
# 需要 GitHub App 的 token 上下文（self-hosted runner 上有的场景下会 token 权限不够）。
# 留一个官方 runner 跑 release 最稳。

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------ Android（手机 + TV）
  # 跑在 NAS Docker 起的 Linux runner 上（镜像里已预装 JDK 17 + Gradle 8.9 + NDK 27）
  android:
    runs-on: [self-hosted, linux, x86_64, apxpc-linux]
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # JDK 17 / Gradle / Android SDK 都在 runner 镜像里预装了 —— 不再 setup-java/setup-gradle

      - name: Build release APKs (app + tv)
        run: ./gradlew :app:assembleRelease :tv:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; echo "EXIT_CODE=$PIPESTATUS" && exit $PIPESTATUS
        shell: bash

      - name: Show build errors
        if: failure()
        run: |
          echo "========== BUILD FAILED =========="
          grep -n -A 5 -i "error:" /tmp/build.log 2>/dev/null || true
          echo "========== LAST 80 LINES =========="
          tail -80 /tmp/build.log 2>/dev/null || true

      - name: Protocol unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tail -50
        shell: bash

      - name: Static analysis (Android Lint, non-blocking)
        continue-on-error: true
        run: ./gradlew :app:lintRelease :tv:lintRelease --no-daemon 2>&1 | tail -40

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            android/app/build/reports/lint-results-release.html
            android/tv/build/reports/lint-results-release.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload app APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-app
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload tv APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-tv
          path: android/tv/build/outputs/apk/release/tv-release.apk
          retention-days: 14

  # ------------------------------------------------ PC（Windows 三件套 + WebView2 前端）
  # 跑在 NAS KVM 里的 Win11 VM self-hosted runner（MSVC 2022 Build Tools + WebView2 SDK + Node 20 预装）
  pc:
    runs-on: [self-hosted, windows, x64, apxpc-win]
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Node 20 / MSVC / CMake / WebView2 SDK 都在 Win VM 里预装了 —— 不再 setup-node / Upgrade CMake

      # --- 前端：npm ci + npm run build ---
      - name: Install web dependencies
        shell: pwsh
        working-directory: pc/web
        run: npm ci --no-audit --no-fund 2>&1 | Select-Object -Last 10

      - name: Build frontend (Vite + React + Tailwind)
        shell: pwsh
        working-directory: pc/web
        run: |
          npm run build 2>&1 | Tee-Object -FilePath web_build.log | Select-Object -Last 20
          if ($LASTEXITCODE -ne 0) { Get-Content web_build.log -Tail 40; exit $LASTEXITCODE }

      # --- CMake Configure ---
      # FetchContent 拉：WebView2 SDK（nuget v3-flatcontainer，~5MB zip）+ wil（GitHub shallow，~1MB）
      - name: Configure (CMake + FetchContent)
        shell: pwsh
        run: |
          cmake -S pc/host -B build_host -G Visual Studio 17 2022 -A x64 `
            -DAPXPC_BUILD_SDK=OFF `
            -DAPXPC_BUILD_EXAMPLES=OFF `
            -DAPXPC_BUILD_UI=ON `
            -DAPXPC_BUILD_UI_WEBVIEW2=ON
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== CMake configure FAILED ==="
            Get-Content build_host/CMakeFiles/CMakeError.log -Tail 60 -ErrorAction SilentlyContinue
            exit 1
          }

      # --- CMake Build ---
      # Post-build step 自动：pc/web/dist/ → build_host/Release/web/
      #                      WebView2Loader.dll → build_host/Release/
      - name: Build (apxhost + apxdesktop + apxsetup)
        shell: pwsh
        run: |
          cmake --build build_host --config Release --target apxhost apxdesktop apxsetup 2>&1 | `
            Tee-Object -FilePath cpp_build.log | Select-Object -Last 30
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== C++ build FAILED ==="
            Get-Content cpp_build.log -Tail 80
            exit $LASTEXITCODE
          }

      # --- Artifacts ---
      - name: Upload PC exes + bundled UI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pc-exes-webview2
          path: |
            build_host/Release/apxhost.exe
            build_host/Release/apxdesktop.exe
            build_host/Release/apxsetup.exe
            build_host/Release/WebView2Loader.dll
            build_host/Release/web/
          retention-days: 14

      - name: Upload web frontend dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: pc/web/dist/
          retention-days: 14

      # --- 失败诊断 ---
      - name: Diagnose on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== CMake error log ==="
          Get-Content build_host/CMakeFiles/CMakeError.log -Tail 60 -ErrorAction SilentlyContinue
          Write-Host "=== CMake output log ==="
          Get-Content build_host/CMakeFiles/CMakeOutput.log -Tail 30 -ErrorAction SilentlyContinue
          Write-Host "=== npm build log ==="
          Get-Content pc/web/web_build.log -Tail 40 -ErrorAction SilentlyContinue

  # ------------------------------------------------ Protocol（跨端常量一致性，纯 Python）
  # 跑在 NAS Linux runner —— Python 3 预装在镜像里
  protocol:
    runs-on: [self-hosted, linux, x86_64, apxpc-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 跨端协议一致性校验
        run: python3 scripts/check_protocol.py

  # ------------------------------------------------ Lint（clang-tidy 扫 C++ 原生模块）
  # 跑在 NAS Windows runner —— clang-tidy 跟随 MSVC Build Tools 一起装的
  lint:
    runs-on: [self-hosted, windows, x64, apxpc-win]
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ninja 必须：MSVC 默认生成器（Visual Studio 17 2022）不导出 compile_commands.json
      - name: Generate compile_commands.json
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            winget install --id Ninja-build.Ninja --exact --accept-source-agreements --accept-package-agreements
          }
          $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine")
          if (Test-Path build_tidy) { Remove-Item -Recurse -Force build_tidy }
          cmake -S pc/host -B build_tidy -G Ninja `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DAPXPC_BUILD_SDK=OFF -DAPXPC_BUILD_EXAMPLES=OFF `
            -DAPXPC_BUILD_UI=ON -DAPXPC_BUILD_UI_WEBVIEW2=ON
          if (-not (Test-Path build_tidy/compile_commands.json)) { throw "compile_commands.json 未生成" }

      # MSVC Build Tools 自带 clang-tidy（在 %ProgramFiles(x86)%\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin）
      - name: Locate clang-tidy
        continue-on-error: true
        shell: pwsh
        run: |
          $vs = Get-ChildItem "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin" -Filter clang-tidy.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($vs) {
            Write-Host "found bundled clang-tidy: $($vs.FullName)"
            $vs.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            Write-Host "not found -> installing LLVM"
            winget install --id LLVM.LLVM --exact --accept-source-agreements --accept-package-agreements
          }

      - name: clang-tidy (core modules, non-blocking)
        continue-on-error: true
        shell: cmd
        run: |
          clang-tidy --version
          set "CHECKS=-*,bugprone-*,clang-analyzer-*,performance-*,-bugprone-easily-swappable-parameters"
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\wireless\ctrl9511.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\wireless\input_injector_win.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\media\audio_capture.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\media\mic_bridge.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\media\touch_inject.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\ui\web_panel.cpp

  # ------------------------------------------------ Release（仅 tag v*）
  # 继续用 GitHub 官方 ubuntu-latest —— 只做 artifact 下载 + zip + GitHub Release 发
  # softprops/action-gh-release 在官方 runner 上权限更稳
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, pc]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Rename artifacts with version
        run: |
          VER="${GITHUB_REF_NAME}"
          mkdir -p out
          cp dist/apk-app/app-release.apk                    "out/AllPeriph-${VER}-app-release.apk"
          cp dist/apk-tv/tv-release.apk                      "out/AllPeriph-${VER}-tv-release.apk"
          cp dist/pc-exes-webview2/apxhost.exe               "out/AllPeriph-${VER}-apxhost.exe"
          cp dist/pc-exes-webview2/apxdesktop.exe            "out/AllPeriph-${VER}-apxdesktop.exe"
          cp dist/pc-exes-webview2/apxsetup.exe              "out/AllPeriph-${VER}-apxsetup.exe"
          cp dist/pc-exes-webview2/WebView2Loader.dll        "out/WebView2Loader.dll"
          cd dist/pc-exes-webview2 && zip -r "../../out/web-frontend.zip" web/ && cd -
          ls -la out/
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 全能外设 ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
          make_latest: true
          body: |
            ## 全能外设 ${{ github.ref_name }}

            ### PC 端（WebView2 新面板）
            - **apxdesktop.exe** —— 桌面控制面板（内嵌 React + Tailwind UI）
            - **apxhost.exe** —— 仅宿主服务（无 GUI）
            - **apxsetup.exe** —— 安装包
            - **WebView2Loader.dll** —— 与 apxdesktop.exe 同目录（便携场景需要）
            - **web-frontend.zip** —— 前端 dist/（解压到 apxdesktop.exe/web/）

            > Win10 2004+ 与 Win11 已自带 WebView2 Runtime；旧版 Win10 需从 https://aka.ms/webviewruntime 下载安装。

# ------------------------------------------------ 权限说明（不进 YAML，纯注释）
#
# GitHub Actions Self-Hosted Runner 权限说明：
# - runner 只要 repo scope 就够（不需要 admin）。repo 级 self-hosted runner（不是 org 级）。
# - 每个 push / PR / tag 都触发；所有 job 都有 runs-on label 精确匹配，不会漏跑。
# - Linux Docker runner 用 --ephemeral：job 执行完自动注销，token 用一次就废。
#   容器重启要重新拿 token（refresh_token.py 用 GitHub PAT 自动刷，见 scripts/selfhosted/linux/）。
# - Windows runner 用 --runasservice：作为 Windows 服务常驻，长期构建不注销。
#
# Self-hosted runner token 有效期：~1 小时。过期后 entrypoint.sh 会 exit 1，
# 配合 docker restart=always 会持续重试 —— GitHub 那边会出现多台"僵尸" runner。
# 强烈建议配 refresh_token.py + cron 每 30 分钟刷一次。
