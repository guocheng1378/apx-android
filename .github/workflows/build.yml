name: Build

# 触发：
#   push master        —— 只做构建验证（Android + PC），不发 release
#   push tag v*        —— 构建三端产物并自动创建 GitHub Release
#   pull_request→master—— PR 上先构建验证，编译错误在合入前拦下
#   workflow_dispatch  —— 手动构建验证
on:
  push:
    branches: [master, 'feat/**']
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  checks: write       # 失败时把编译错误写进 check-run annotation（公开仓库匿名可读）

# ---- 官方 runner 版本（最简单最快，零配置零硬件零维护）----
# GitHub Free 仓库：Android + Linux + PC 原生编译 + Release 全跑在官方 runner 上。
#
# 如果你哪天 CI 配额用爆 / 敏感代码不能过第三方机器 / 外网出不去：
#   备份在 .github/workflows/build.yml.selfhosted-backup 里，改回去就行。

jobs:
  # ------------------------------------------------ Android（手机 + TV）
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # JDK 21：AGP 9.4.1 + Kotlin 2.4.20 组合的工具链（与 Miuix 0.9.4 上游一致）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK + NDK + CMake
        shell: bash
        run: |
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDK" --licenses > /dev/null 2>&1 || true

          # 尽力预装以加速构建，但**不再阻断**：licenses 已接受，缺什么由 AGP
          # 构建期自动下载（platforms / build-tools / NDK / CMake 都支持
          # auto-download；Miuix 0.9.4 上游的 android CI 连 sdkmanager 步骤都
          # 没有，直接 gradlew 构建即绿——run#667 教训：镜像没有的新组件
          # （android-37 / build-tools 37.0.0）一旦 sdkmanager 装失败，旧版
          # 「目录不存在 → ::error:: → exit 1」把整轮构建判死在环境层，
          # 编译一行都没跑（失败仅 1m35s，Build 步骤全被跳过）。
          #
          # 另修退出码 bug：旧写法 `"$SDK" "$pkg" | tail -3` 的 if 判断的是
          # tail 的退出码（恒 0），三次重试形同虚设；现在输出落文件，
          # 用 sdkmanager 的真实退出码判断重试。
          for pkg in "platform-tools" "build-tools;35.0.0" "build-tools;37.0.0" "platforms;android-35" \
                     "platforms;android-34" "platforms;android-37" "ndk;27.2.12479018" "cmake;3.22.1"; do
            ok=0
            for i in 1 2 3; do
              echo "===== sdkmanager install '$pkg' (attempt $i) ====="
              if "$SDK" "$pkg" < /dev/null > /tmp/sdk-pkg.log 2>&1; then
                ok=1
                tail -2 /tmp/sdk-pkg.log
                break
              fi
              tail -5 /tmp/sdk-pkg.log
              sleep 10
            done
            [ "$ok" = 1 ] || echo "::warning::$pkg 三次都没装上（构建期 AGP 自动补齐）"
          done

          # 只报告不阻断：缺的组件交给 AGP 构建期 auto-download 补齐
          for d in "platforms/android-35" "platforms/android-34" "platforms/android-37" "build-tools/35.0.0" \
                   "build-tools/37.0.0" "ndk/27.2.12479018" "cmake/3.22.1"; do
            if [ -d "$ANDROID_HOME/$d" ]; then
              echo "OK   $ANDROID_HOME/$d"
            else
              echo "MISS $ANDROID_HOME/$d（构建期 AGP 自动下载）"
            fi
          done

      # Gradle 9.7.1 wrapper 三件套：仓库只提交了 properties（distributionUrl=9.7.1），
      # gradlew / gradlew.bat / gradle-wrapper.jar 不入库 —— 从 gradle 仓库 v9.7.1
      # tag 直接下载（wrapper 脚本是通用件，适用任何项目）。
      # run#668 教训：`gradle wrapper` 依赖 runner 自带的 gradle 命令，
      # ubuntu-latest 镜像滚动更新下它不可靠——本次在隔离目录直接失败，
      # Build 根本没跑（annotation 只剩「未捕获到 error 行」）。
      - name: Download Gradle wrapper (9.7.1)
        run: |
          BASE=https://raw.githubusercontent.com/gradle/gradle/v9.7.1
          curl -fsSL --retry 3 -o gradlew "$BASE/gradlew"
          curl -fsSL --retry 3 -o gradlew.bat "$BASE/gradlew.bat"
          curl -fsSL --retry 3 -o gradle/wrapper/gradle-wrapper.jar "$BASE/gradle/wrapper/gradle-wrapper.jar"
          chmod +x ./gradlew

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build release APKs (app + tv)
        run: ./gradlew :app:assembleRelease :tv:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; echo "EXIT_CODE=$PIPESTATUS" && exit $PIPESTATUS
        shell: bash

      - name: Show build errors
        if: failure()
        run: |
          echo "========== BUILD FAILED =========="
          grep -an -A 5 -i "error:" /tmp/build.log 2>/dev/null || true
          echo "========== LAST 80 LINES =========="
          tail -80 /tmp/build.log 2>/dev/null || true

      # 失败可见性：workflow logs API 要求仓库 admin 权限，没 PAT 的会话（云端 AI 等）
      # 根本读不到日志，只能靠猜。
      #
      # 用 **workflow command**（`::error::`）而不是 check-runs API：GitHub 会把它
      # 自动收集成该 job 的 annotation，公开仓库匿名可读，且不需要任何 token 权限
      # —— 原先用 gh api 先查 check-run id 再 POST，实测在 job 进行中返回 404
      # （Not Found），annotation 一直没写上去。
      #
      # 注意：GitHub 每个 step 最多保留 10 条 annotation、消息长度有限，所以取前 10 行
      # 并截断；完整日志另有 job summary 与 artifact 两条路。
      - name: Publish build errors (annotation + summary)
        if: failure()
        continue-on-error: true
        run: |
          mkdir -p ci-log
          # grep -a：Kotlin/Gradle 错误输出可能带 ANSI 颜色码（run#668 教训：
          # `^e: ` 因行首有转义序列全部漏配，annotation 只剩「未捕获到 error 行」）
          if [ -f /tmp/build.log ]; then
            grep -an -E "e: |error: |FAILURE: |What went wrong|> Task .*FAILED|Execution failed" \
              /tmp/build.log | head -60 > ci-log/errors.txt || true
            tail -60 /tmp/build.log > ci-log/last60.txt || true
          else
            echo "/tmp/build.log 不存在 —— Build 步骤未执行或前置步骤失败（看本 job 各 step 状态）" > ci-log/errors.txt
            : > ci-log/last60.txt
          fi
          echo "========== ERRORS =========="; cat ci-log/errors.txt 2>/dev/null || true
          echo "========== LAST 60 LINES =========="; cat ci-log/last60.txt 2>/dev/null | head -60 || true
          {
            echo "## Android 构建失败 · 错误摘录"
            echo ''
            echo '```'
            head -40 ci-log/errors.txt 2>/dev/null || true
            echo '```'
            echo ''
            echo '### 最后 60 行'
            echo ''
            echo '```'
            cat ci-log/last60.txt 2>/dev/null | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # workflow command 需要转义 %、CR、LF（顺序：先 % 再换行）
          n=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' | cut -c1-600)
            echo "::error title=Android build error::${msg}"
            n=$((n + 1))
            [ "$n" -ge 10 ] && break
          done < ci-log/errors.txt
          # 错误行没捕获到时，用 build.log 尾部兜底（run#668 教训）
          if [ "$n" -eq 0 ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              msg=$(printf '%s' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' | cut -c1-600)
              echo "::error title=Android build tail::${msg}"
              n=$((n + 1))
              [ "$n" -ge 8 ] && break
            done < ci-log/last60.txt
          fi

      - name: Upload build log (debug)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-android
          path: |
            ci-log/errors.txt
            ci-log/last60.txt
            /tmp/build.log
          retention-days: 7
          if-no-files-found: ignore

      # 原生符号自检（真机教训）：只 enable CXX 的 CMake 工程会静默跳过 .c 源文件，
      # 编译链接与 CI 全绿、运行期才报 "No implementation found ... UinputGamepad"，
      # 虚拟手柄/摇杆静默不可用。所以构建后必须验**产物**，别信"编译通过"。
      - name: Verify native JNI symbols in APKs
        run: |
          python3 - <<'PY'
          import sys, zipfile
          WANT = {
              "app/build/outputs/apk/release/app-release.apk": (
                  "lib/arm64-v8a/libapx.so",
                  ["Java_com_allperiph_shared_input_UinputGamepad_openGamepad",
                   "Java_com_allperiph_shared_input_UinputGamepad_sendAxis",
                   "Java_com_allperiph_shared_input_UinputGamepad_sendButton",
                   "Java_com_allperiph_shared_input_UinputGamepad_closeGamepad",
                   "Java_com_allperiph_core_ApxNative_nativeInit"],
              ),
              "tv/build/outputs/apk/release/tv-release.apk": (
                  "lib/arm64-v8a/libapxtv.so",
                  ["Java_com_allperiph_shared_input_UinputGamepad_openGamepad"],
              ),
          }
          bad = []
          for apk, (so, syms) in WANT.items():
              z = zipfile.ZipFile(apk)
              data = z.read(so)
              for s in syms:
                  ok = s.encode() in data
                  print(("OK   " if ok else "MISS ") + apk + " :: " + so + " :: " + s)
                  if not ok:
                      bad.append(apk + " :: " + so + " 缺 " + s)
          if bad:
              print("========== 原生符号自检失败 ==========")
              print("\n".join(bad))
              sys.exit(1)
          PY

      - name: Protocol unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tail -50

      - name: Static analysis (Android Lint, non-blocking)
        continue-on-error: true
        run: ./gradlew :app:lintRelease :tv:lintRelease --no-daemon --stacktrace 2>&1 | tail -40

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            android/app/build/reports/lint-results-release.html
            android/tv/build/reports/lint-results-release.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload app APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-app
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload tv APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-tv
          path: android/tv/build/outputs/apk/release/tv-release.apk
          retention-days: 14

  # ------------------------------------------------ PC（Windows 三件套 + WebView2 前端）
  # 跑在 GitHub 官方 windows-latest runner —— 自带 MSVC 2022 Build Tools + Node 20 + CMake
  # WebView2 SDK 通过 CMake FetchContent 从 nuget v3-flatcontainer 拉（5MB zip，外网畅通）
  pc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Node 20 —— 前端 Vite 构建
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pc/web/package-lock.json

      # MSVC x64 —— C++ 原生编译（windows-latest 自带 VS 2022 Build Tools）
      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # --- 前端：npm ci + npm run build ---
      - name: Install web dependencies
        shell: pwsh
        working-directory: pc/web
        run: npm ci --no-audit --no-fund 2>&1 | Select-Object -Last 10

      - name: Build frontend (Vite + React + Tailwind)
        shell: pwsh
        working-directory: pc/web
        run: |
          npm run build 2>&1 | Tee-Object -FilePath web_build.log | Select-Object -Last 20
          if ($LASTEXITCODE -ne 0) { Get-Content web_build.log -Tail 40; exit $LASTEXITCODE }

      # --- CMake Configure ---
      # APXPC_BUILD_UI=ON + APXPC_BUILD_UI_WEBVIEW2=ON → 新 WebView2 面板
      # FetchContent 拉：WebView2 SDK（nuget v3-flatcontainer，~5MB zip）+ wil（GitHub shallow，~1MB）
      - name: Configure (CMake + WebView2 SDK + wil via FetchContent)
        shell: pwsh
        run: |
          cmake -S pc/host -B build_host -G "Visual Studio 18 2026" -A x64 `
            -DAPXPC_BUILD_SDK=OFF `
            -DAPXPC_BUILD_EXAMPLES=OFF `
            -DAPXPC_BUILD_UI=ON `
            -DAPXPC_BUILD_UI_WEBVIEW2=ON
          $cmakeExit = $LASTEXITCODE
          if ($cmakeExit -ne 0) {
            Write-Host "=== CMake configure FAILED (exit=$cmakeExit) ==="
            Get-Content build_host/CMakeFiles/CMakeError.log -Tail 60 -ErrorAction SilentlyContinue
            exit $cmakeExit
          }

      # --- CMake Build ---
      # Post-build step 自动：pc/web/dist/ → build_host/Release/web/
      #                      WebView2Loader.dll → build_host/Release/
      - name: Build (apxhost + apxdesktop + apxsetup)
        shell: pwsh
        run: |
          cmake --build build_host --config Release --target apxhost apxdesktop apxsetup 2>&1 | `
            Tee-Object -FilePath cpp_build.log | Select-Object -Last 30
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== C++ build FAILED ==="
            Get-Content cpp_build.log -Tail 80
            exit $LASTEXITCODE
          }

      # --- 单元测试（离线可跑；此前从未进过 CI）---
      # 七个用例属于 pc/host 工程：arbiter / utf16_convert / ctrl_frame /
      # wireless_session_lifecycle / localsend_protocol / localsend_upload /
      # localsend_sender（发送端：真端口对假对端跑 register→prepare→upload）。
      # tcp_transport_test 在 pc/display 那个独立工程里
      # （CMakeLists 也是另一份），build_host 里根本没有这个 target —— 列在这里会让
      # MSBuild 直接 MSB1009「Project file does not exist」，整步红掉。
      # 这些在 CMake 里一直有 add_test，但 pc job 只有 configure→build→upload，
      # 从没跑过 ctest：v198 那个「stop() 后进程退不掉」的 beacon 死锁，正是靠
      # wireless_session_lifecycle_test 兜住的 —— 没有门禁，下次回归照样漏。
      - name: Build unit tests
        shell: pwsh
        run: |
          cmake --build build_host --config Release --target `
            arbiter_test utf16_convert_test ctrl_frame_test relative_move_test `
            gamepad_fallback_test phone_mode_test tcp_probe_test `
            wireless_session_lifecycle_test localsend_protocol_test `
            localsend_upload_test localsend_sender_test 2>&1 | `
            Tee-Object -FilePath test_build.log | Select-Object -Last 20
          if ($LASTEXITCODE -ne 0) { Get-Content test_build.log -Tail 60; exit $LASTEXITCODE }

      - name: Run unit tests (ctest)
        shell: pwsh
        run: ctest --test-dir build_host -C Release --output-on-failure

      # --- Artifacts ---
      - name: Upload PC exes + bundled UI
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pc-exes-webview2
          path: |
            build_host/Release/apxhost.exe
            build_host/Release/apxdesktop.exe
            build_host/Release/apxsetup.exe
            build_host/Release/WebView2Loader.dll
            build_host/Release/web/
          retention-days: 14

      - name: Upload web frontend dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: pc/web/dist/
          retention-days: 14

      # --- 失败诊断 ---
      - name: Diagnose on failure
        if: failure()
        shell: pwsh
        run: |
          Write-Host "=== CMake error log ==="
          Get-Content build_host/CMakeFiles/CMakeError.log -Tail 60 -ErrorAction SilentlyContinue
          Write-Host "=== CMake output log ==="
          Get-Content build_host/CMakeFiles/CMakeOutput.log -Tail 30 -ErrorAction SilentlyContinue
          Write-Host "=== npm build log ==="
          Get-Content pc/web/web_build.log -Tail 40 -ErrorAction SilentlyContinue

  # ------------------------------------------------ Lint（clang-tidy 扫 C++ 原生模块）
  # 跑在官方 windows-latest —— clang-tidy 跟随 VS 2022 Build Tools 一起装
  lint:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Ninja 必须：VS 默认生成器（Visual Studio 18 2026）不导出 compile_commands.json
      - name: Generate compile_commands.json
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction.SilentlyContinue)) {
            Write-Host "ninja not found -> installing via choco"
            choco install ninja -y --no-progress
            $env:PATH = "C:\ProgramData\chocolatey\bin;$env:PATH"
          }
          if (Test-Path build_tidy) { Remove-Item -Recurse -Force build_tidy }
          cmake -S pc/host -B build_tidy -G Ninja `
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
            -DAPXPC_BUILD_SDK=OFF -DAPXPC_BUILD_EXAMPLES=OFF `
            -DAPXPC_BUILD_UI=ON -DAPXPC_BUILD_UI_WEBVIEW2=ON
          if (-not (Test-Path build_tidy/compile_commands.json)) { throw "compile_commands.json 未生成" }

      # windows-latest 镜像里 clang-tidy 不一定在 PATH（VS 自带那份的路径随版本变），
      # 所以：先用 vswhere 动态定位（排除 ARM64），再按已知 x64 路径找，最后 choco 兜底。
      # 注意：GitHub 的 job 级 continue-on-error 不生效，必须落在 step 上。
      - name: Locate clang-tidy
        continue-on-error: true
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if ($vs) {
            # 递归查找会先命中 ARM64 版（目录排序在前），在 x64 runner 上会报
            # "not compatible with the version of Windows" —— 必须排除，只取 x64。
            $t = Get-ChildItem "$vs\VC\Tools\Llvm" -Recurse -Filter clang-tidy.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\ARM64\\' } | Select-Object -First 1
            if ($t) {
              Write-Host "found bundled clang-tidy: $($t.FullName)"
              $t.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              exit 0
            }
          }
          # vswhere 落空 -> 按已知 VS 路径找（都是 x64\bin，非递归，不会命中 ARM64）
          # VS 18 (2026) / VS 17 (2022) 路径都试一下
          $vsLlvm = @(
            "C:\Program Files\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin",
            "C:\Program Files\Microsoft Visual Studio\18\Community\VC\Tools\Llvm\x64\bin",
            "C:\Program Files\Microsoft Visual Studio\18\Professional\VC\Tools\Llvm\x64\bin",
            "C:\Program Files (x86)\Microsoft Visual Studio\18\Enterprise\VC\Tools\Llvm\x64\bin",
            "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\Llvm\x64\bin"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($vsLlvm) {
            $clangTidy = Get-ChildItem $vsLlvm -Filter clang-tidy.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($clangTidy) {
              Write-Host "found bundled clang-tidy: $($t.FullName)"
              $clangTidy.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
              exit 0
            }
          }
          Write-Host "not bundled -> installing LLVM via choco"
          choco install llvm -y --no-progress

      - name: clang-tidy (core modules)
        continue-on-error: true
        shell: cmd
        run: |
          clang-tidy --version
          set "CHECKS=-*,bugprone-*,clang-analyzer-*,performance-*,-bugprone-easily-swappable-parameters"
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\wireless\ctrl9511.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\wireless\input_injector_win.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\media\audio_capture.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\media\mic_bridge.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\media\touch_inject.cpp
          clang-tidy -p build_tidy -checks="%CHECKS%" pc\host\src\ui\web_panel.cpp

  # ------------------------------------------------ 协议一致性（跨端常量 / 命令号）
  # 纯 Python，跑 ubuntu-latest 最稳
  protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 跨端协议一致性校验
        run: python3 scripts/check_protocol.py

      # 清单里的类名写错了**不会**让构建变红（清单合并只认字符串），只会静默失效：
      # 本仓库已踩过 4 次（AppxImeService / AppxAccessibilityService / KeepAliveReceiver
      # 包名错误 / ExternalSendActivity 从未实现）。这里按 namespace 拼全限定名核对。
      - name: Manifest 声明 vs 源文件
        run: python3 scripts/check_manifest_classes.py

      # UI 一致性：布局/drawable 里的字面色值、布局里的硬编码文案（见 docs/UI-CHECKLIST.md）。
      # 这两类编译器都不报，只在真机上以「深色看不清」「换肤没跟着变」暴露。
      - name: UI 一致性（色值令牌化 + 文案入资源）
        run: python3 scripts/check_ui_tokens.py

  # ------------------------------------------------ Release（仅 tag v*）
  # 跑在 windows-latest 上 —— Inno Setup 编译器只在 Windows 上有
  # macOS 资产由 macos.yml 的 tag 构建独立上传（两边对同一 Release 幂等协作：
  # 谁先完成谁建 Release，后到者 --clobber 追加 —— 见 macos.yml Upload to GitHub Release）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [pc, android]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download PC artifacts
        uses: actions/download-artifact@v4
        with:
          name: pc-exes-webview2
          path: dist/pc-exes-webview2

      - name: Download Android APKs
        uses: actions/download-artifact@v4
        with:
          name: apk-app
          path: dist/apk-app

      - name: Download TV APK
        uses: actions/download-artifact@v4
        with:
          name: apk-tv
          path: dist/apk-tv

      - name: Build single-EXE Setup with Inno
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $iscc = (Get-ChildItem 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' -ErrorAction Stop).FullName
          Write-Host "ISCC=$iscc"
          $art = (Resolve-Path 'dist\pc-exes-webview2').Path
          $ico = (Resolve-Path 'pc\host\res').Path
          New-Item -ItemType Directory -Force out | Out-Null
          $out = (Resolve-Path out).Path
          & $iscc "scripts\installer\AllPeriph.iss" `
            "/DMyAppVersion=${env:GITHUB_REF_NAME}" `
            "/DArtifactsDir=$art" `
            "/DIconDir=$ico" `
            "/DOutputDir=$out"
          if ($LASTEXITCODE -ne 0) { Write-Host 'iscc FAILED' -ForegroundColor Red; exit 1 }
          Get-ChildItem out/
        shell: pwsh

      - name: Build portable zip
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $VER = $env:GITHUB_REF_NAME
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item dist/pc-exes-webview2/apxdesktop.exe portable/
          Copy-Item dist/pc-exes-webview2/apxhost.exe portable/
          Copy-Item dist/pc-exes-webview2/WebView2Loader.dll portable/
          Copy-Item -Recurse dist/pc-exes-webview2/web portable/
          Compress-Archive -Path portable/* -DestinationPath "out/AllPeriph-${VER}-portable.zip" -Force
          Get-ChildItem out/
        shell: pwsh

      - name: Collect Android APKs
        run: |
          Set-Location $env:GITHUB_WORKSPACE
          $VER = $env:GITHUB_REF_NAME
          Copy-Item dist/apk-app/app-release.apk "out/AllPeriph-${VER}-app.apk"
          Copy-Item dist/apk-tv/tv-release.apk "out/AllPeriph-${VER}-tv.apk"
          Get-ChildItem out/
        shell: pwsh

      - name: Extract changelog section (Release 正文顶部必须写清「改了什么」)
        # 规则：每个 Release 的正文 = docs/CHANGELOG.md 里对应版本的段（改了什么）
        #       + .github/release-body-assets.md（各资产怎么用）+ GitHub 自动生成的
        #       Full Changelog。明细的真源是 CHANGELOG；发版前没写那段，这里打 error
        #       并降级为占位 —— 不允许「只有下载说明、不知道改了什么」的 Release。
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $lines = Get-Content docs/CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -like "## $tag*") { $start = $i; break }
          }
          if ($start -lt 0) {
            Write-Host "::error::docs/CHANGELOG.md 里没有 $tag 的段落 —— 发版前必须先写版本明细（改了什么）"
            "## 全能外设 $tag`n`n> 本版本明细缺失：发版流程要求每个 Release 顶部写清「改了什么」，见 docs/CHANGELOG.md。`n" | Set-Content release_notes.md -Encoding utf8
            exit 0
          }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -like "## v*") { $end = $i; break }
          }
          $section = $lines[$start..($end - 1)]
          while ($section.Count -gt 0 -and (($section[-1] -eq '---') -or ($section[-1].Trim() -eq ''))) {
            $section = $section[0..($section.Count - 2)]
          }
          $assets = (Get-Content .github/release-body-assets.md -Raw) -replace '\{\{TAG\}\}', $tag
          (($section -join "`n") + "`n`n---`n`n" + $assets) | Set-Content release_notes.md -Encoding utf8
          Write-Host "release_notes.md：$tag 段 $($section.Count) 行 + 资产说明"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          name: 全能外设 ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
          make_latest: true
          body_path: release_notes.md
