name: Build

# 触发：
#   push master        —— 只做构建验证（Android + PC），不发 release
#   push tag v*        —— 构建三端产物并自动创建 GitHub Release
#   pull_request→master—— PR 上先构建验证，编译错误在合入前拦下
#   workflow_dispatch  —— 手动构建验证
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ------------------------------------------------ Android（手机 + TV）
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK + NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # release 签名的 keystore（android/apx-release.keystore）在版本库内，可直接出正式包
      - name: Build release APKs (app + tv)
        run: ./gradlew :app:assembleRelease :tv:assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; echo "EXIT_CODE=$PIPESTATUS" && exit $PIPESTATUS
        shell: bash

      - name: Show build errors
        if: failure()
        run: |
          echo "========== BUILD FAILED =========="
          grep -n -A 5 -i "error:" /tmp/build.log 2>/dev/null || true
          echo "========== LAST 80 LINES =========="
          tail -80 /tmp/build.log 2>/dev/null || true

      # v1.7：协议层单元测试（**阻塞**）—— 黄金帧 / CRC 向量 / 重同步纪律 / 分片重组。
      # 这些是跨端线上格式的契约，挂了就不该发版。
      # 注意：开发机若是 Windows 且项目路径含中文，本任务会 ClassNotFoundException
      # （Gradle test worker 在非 ASCII 路径下的老问题），以 CI 结果为准。
      - name: Protocol unit tests
        run: ./gradlew :app:testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tail -50
        shell: bash

      # v184：静态检查（**不阻塞**）。本轮人工审查抓到的"无锁共享状态、未清理监听、
      # 资源泄漏、越界写入"多数本可被 Android Lint 提前发现。首次运行会有一批历史告警，
      # 故意不拦构建 —— 先建立基线，后续逐步收紧。
      - name: Static analysis (Android Lint, non-blocking)
        continue-on-error: true
        run: ./gradlew :app:lintRelease :tv:lintRelease --no-daemon 2>&1 | tail -40

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: |
            app/build/reports/lint-results-release.html
            tv/build/reports/lint-results-release.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload app APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-app
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload tv APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-tv
          path: android/tv/build/outputs/apk/release/tv-release.apk
          retention-days: 14

  # ------------------------------------------------ PC（Windows 三件套）
  pc:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake)
        run: cmake -S pc/host -B build_host -DAPXPC_BUILD_SDK=OFF -DAPXPC_BUILD_EXAMPLES=OFF -DAPXPC_BUILD_UI=OFF
        shell: cmd

      - name: Build (apxhost / apxdesktop / apxsetup)
        run: cmake --build build_host --config Release --target apxhost apxdesktop apxsetup
        shell: cmd

      - name: Upload PC exes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pc-exes
          path: |
            build_host/Release/apxhost.exe
            build_host/Release/apxdesktop.exe
            build_host/Release/apxsetup.exe
          retention-days: 14

  # ------------------------------------------------ 静态检查（独立 job，不阻塞）
  # v184：本轮人工审查抓到的 3 个致命问题（线程未 join → std::terminate、detach 线程 UAF、
  # 未判返回值空指针）与一批"跨线程裸共享状态"，恰恰都在 clang-analyzer / bugprone 的
  # 检测范围内。独立成 job：失败不影响构建与发版（先建基线），后续逐步扩大范围并收紧。
  lint:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Generate compile_commands.json
        shell: cmd
        run: cmake -S pc/host -B build_tidy -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DAPXPC_BUILD_SDK=OFF -DAPXPC_BUILD_EXAMPLES=OFF -DAPXPC_BUILD_UI=OFF

      # windows-latest 镜像里 clang-tidy 不一定在 PATH（VS 自带那份的路径随版本变），
      # 所以先用 vswhere 定位 VS 自带的，找不到再用 choco 装。
      # 注意：GitHub 的 job 级 continue-on-error 不生效，必须落在 step 上。
      - name: Locate clang-tidy
        continue-on-error: true
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $t = Get-ChildItem "$vs\VC\Tools\Llvm" -Recurse -Filter clang-tidy.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($t) {
            Write-Host "found bundled clang-tidy: $($t.FullName)"
            $t.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            Write-Host "not bundled -> installing llvm via choco"
            choco install llvm -y --no-progress
          }

      # 先只扫改动最频繁、问题最集中的几个文件
      - name: clang-tidy (core modules)
        continue-on-error: true
        shell: cmd
        run: |
          clang-tidy --version
          clang-tidy -p build_tidy pc\host\src\wireless\ctrl9511.cpp
          clang-tidy -p build_tidy pc\host\src\wireless\input_injector_win.cpp
          clang-tidy -p build_tidy pc\host\src\media\audio_capture.cpp
          clang-tidy -p build_tidy pc\host\src\media\mic_bridge.cpp
          clang-tidy -p build_tidy pc\host\src\media\touch_inject.cpp
          clang-tidy -p build_tidy pc\host\src\ui\panel_win32.cpp

  # ------------------------------------------------ 协议一致性（跨端常量 / 命令号）
  # v1.7：同一份 APX1 协议被手写了四遍（C++ / 手机端 / TV 端 / PC 控制面），
  # 漂移是"某方向偶尔不工作"类缺陷的主要来源（键码偏移、0x04 分发、CRC 范围都踩过）。
  # 这个 job 是**阻塞**的：不一致就红，不给合入与发版留口子。
  protocol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 跨端协议一致性校验
        run: python3 scripts/check_protocol.py

  # ------------------------------------------------ Release（仅 tag v*）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, pc]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Rename artifacts with version
        run: |
          VER="${GITHUB_REF_NAME}"   # 形如 v184
          mkdir -p out
          cp dist/apk-app/app-release.apk        "out/AllPeriph-${VER}-app-release.apk"
          cp dist/apk-tv/tv-release.apk          "out/AllPeriph-${VER}-tv-release.apk"
          cp dist/pc-exes/apxhost.exe            "out/AllPeriph-${VER}-apxhost.exe"
          cp dist/pc-exes/apxdesktop.exe         "out/AllPeriph-${VER}-apxdesktop.exe"
          cp dist/pc-exes/apxsetup.exe           "out/AllPeriph-${VER}-apxsetup.exe"
          ls -la out/
        shell: bash

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 全能外设 ${{ github.ref_name }}
          files: out/*
          generate_release_notes: true
          make_latest: true
