name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK + NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Debug - list build outputs
        if: always()
        run: |
          echo "=== find all apk ==="
          find . -name "*.apk" -type f 2>/dev/null
          echo "=== ls app/build/outputs ==="
          ls -laR app/build/outputs/ 2>/dev/null || echo "outputs dir not found"
          echo "=== ls app/build/ ==="
          ls -la app/build/ 2>/dev/null || echo "build dir not found"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apx-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
