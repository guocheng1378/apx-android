name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK + NDK + CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" \
            "build-tools;35.0.0" \
            "platforms;android-35" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"
          echo "=== SDK platforms ==="
          ls -la "$ANDROID_HOME/platforms/"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Clean build cache
        run: ./gradlew clean --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build.log; echo "EXIT_CODE=$PIPESTATUS" && exit $PIPESTATUS
        shell: bash

      - name: Show build errors
        if: failure()
        run: |
          echo "========== BUILD FAILED =========="
          grep -n -A 5 -i "error:" /tmp/build.log 2>/dev/null || true
          echo "========== LAST 80 LINES =========="
          tail -80 /tmp/build.log 2>/dev/null || true

      - name: Find APK
        if: always()
        run: find . -name "*.apk" -type f 2>/dev/null
        working-directory: .

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apx-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: 全能外设 v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
          make_latest: true