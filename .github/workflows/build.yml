name: Build APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "platform-tools" "build-tools;35.0.0" "platforms;android-35"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Show Gradle info
        run: |
          ./gradlew --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la app/src/main/java/com/allperiph/ui/MainActivity.kt

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --info 2>&1 | tail -200

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apx-debug
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
