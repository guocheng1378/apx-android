name: Build Debug APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform 35 / build-tools
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
        continue-on-error: true

      # 注意：仓库此前一直没有 gradlew（只有 gradle-wrapper.properties），
      # CI 里 ./gradlew 会直接 “No such file or directory” —— 这是历史构建
      # 一直失败的头号原因。这里改用 gradle/actions/setup-gradle 安装 Gradle，
      # 不依赖 wrapper 启动脚本，规避该问题。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
