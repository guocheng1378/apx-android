name: macOS Build

# macOS 端（mac-port 分支）编译验证：
#   push mac-port / master —— 构建 apxhost（CLI 宿主 + 浏览器面板 panel_http）
#                              + apxdesktop（桌面壳，mac=HTTP 面板宿主，mac-desktop 起纳入 CI）
#   push tag v*           —— 同上构建，并把 zip 重命名为 AllPeriph-<tag>-macos-arm64.zip
#                            上传到对应 GitHub Release（与 build.yml release job 双向幂等：
#                            谁先跑完谁建 Release，后到者 --clobber 追加/覆盖）
#   pull_request→master   —— 合入前拦下编译错误
#   workflow_dispatch      —— 手动触发
# 失败时：
#   1) make -k 全量报错
#   2) 完整日志尾部推到 ci-logs 分支（contents API 免鉴权可读，拿全现场）——先做，最可靠
#   3) ::error:: 注解（必须显式 :: 分隔符：消息里若含 std::nullptr_t 这类双冒号，
#      GitHub 会拿第一个 :: 当分隔符把消息截断；前缀写成 ::error:: 后第一个 :: 就是自己的）
# 成功时：
#   strip 后打包 apxhost/apxdesktop + web/ 前端 dist + AllPeriph.app（双击壳：ad-hoc 签名、
#   Info.plist 挂麦克风/系统音频用途说明 —— TCC 授权宿主）为 zip 上传 artifact，
#   解压即用（双击 AllPeriph.app，或 ./apxdesktop / ./apxhost panel 自动打开浏览器面板）

on:
  push:
    branches: [master, mac-port]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # 失败时推 ci-logs 分支；tag 构建时上传 Release 资产

jobs:
  mac:
    name: build (macOS)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build web frontend (Vite + React)
        # 浏览器面板的前端 dist：`apxhost panel` / `apxdesktop` 从 exe 旁 web/ 读取。
        # 用 npm install 而非 npm ci（不强依赖 package-lock.json，与 Windows 侧构建口径一致）
        run: |
          cd pc/web
          npm install
          npm run build

      - name: Configure (CMake)
        run: |
          cmake -S pc/host -B build_host -DCMAKE_BUILD_TYPE=Release -DAPXPC_BUILD_UI=OFF -DAPXPC_BUILD_TESTS=ON

      - name: Build (apxhost + apxdesktop)
        # apxdesktop：mac 桌面壳（desktop_main → runWebPanelHttp）。历史上 mac CI **只 build
        # apxhost**，desktop_main 的 mac 兼容性（share.h / 宿主栈符号面）从未过堂 —— 本步把它
        # 纳入编译，mac-desktop 起第一次真刀验证。
        # 注：tag 构建时 CMake 的发版段会从 GITHUB_REF_NAME 注入 APXPC_VERSION_STRING，
        # `apxhost --version` 即为 tag 号（与 build.yml 三端同源逻辑一致）。
        run: cmake --build build_host -j4 --target apxhost apxdesktop

      - name: Build + run unit tests (ctest)
        # 八个用例都在 pc/host 工程里；tcp_transport_test 属于 pc/display 那个独立工程，
        # 不在 build_host 的 target 列表里。
        # macOS 此前 -DAPXPC_BUILD_TESTS=OFF，测试连编译都没过堂；打开后 mac 侧回归也有了门禁。
        # 新增用例记得同步这里与 build.yml —— 只加 CMake target 不加这里，
        # ctest 会以「Not Run（找不到可执行文件）」红，v223.3 就是这么红的。
        run: |
          cmake --build build_host -j4 --target arbiter_test utf16_convert_test ctrl_frame_test relative_move_test gamepad_fallback_test phone_mode_test tcp_probe_test wireless_session_lifecycle_test localsend_protocol_test localsend_upload_test localsend_sender_test
          ctest --test-dir build_host --output-on-failure

      - name: Save symbols (for crash-offset lookup)
        # 崩溃报告里只有 imageOffset，必须配「同一构建的未 strip 二进制 + nm 符号表」才能
        # 对到函数名。v223 的 mac 崩溃（issue#47）就是只能手工反汇编定位的 —— 这步把现场
        # 留成 artifact。**必须在 Package（会 strip）之前跑**，否则拿到的也是空壳。
        if: success()
        run: |
          cd build_host
          cp apxdesktop apxdesktop.unstripped
          cp apxhost apxhost.unstripped
          nm -n apxdesktop.unstripped > apxdesktop.symbols
          nm -n apxhost.unstripped > apxhost.symbols
          c++filt < apxdesktop.symbols > apxdesktop.symbols.demangled
          # 兜底断言：符号表为空 = 上游构建把符号也去掉了，此时「偏移→函数名」整条链断掉，
          # 与其发一个查不了崩溃的包，不如在这里就红。
          test "$(wc -l < apxdesktop.symbols)" -gt 100
          head -5 apxdesktop.symbols.demangled

      - name: Package (strip + web dist + .app bundle + zip)
        if: success()
        run: |
          cd build_host
          strip apxhost || true
          strip apxdesktop || true
          STAGE=apxhost-macos-arm64
          mkdir -p "$STAGE/web"
          cp apxhost "$STAGE/"
          cp apxdesktop "$STAGE/"
          cp -r ../pc/web/dist/. "$STAGE/web/"

          # —— AllPeriph.app（双击入口 + TCC 授权宿主）——
          # ⚠️ web/ 必须在签名【前】放进 Contents/MacOS/web：签名后再往 bundle 里放任何
          # 文件都会打破 CodeResources 封印（seal 里没有 web/ 的记录），Apple Silicon 上
          # 双击 .app 会被内核直接 SIGKILL——无弹窗秒退，只在
          # ~/Library/Logs/DiagnosticReports 留 .ips。v223.7~v223.10 的 mac 包（release
          # 与 artifact 同管线）全部中招，真机实锤：双击闪退、顶层 ./apxdesktop 正常。
          # 不用 --deep：--deep 会把 Contents/MacOS/ 下的 web/ 当嵌套代码树要求签名，
          # .js 不可签 → "code object is not signed at all" exit 1（#47/#48/#50/#52 四轮
          # CI 实锤）。不带 --deep 时 web/ 按普通文件封进 seal，最后用 verify --strict
          # 自证：seal 不完整直接红，不再出带病包。
          # strip 会破坏链接期 ad-hoc 签名，这里统一补签：arm64 的 Mach-O 执行与 TCC 按
          # bundle 归属记录都依赖签名。ad-hoc（无公证）→ 下载后仍走「仍要打开」放行流程。
          APP="$STAGE/AllPeriph.app"
          mkdir -p "$APP/Contents/MacOS"
          cp apxdesktop "$APP/Contents/MacOS/apxdesktop"
          printf 'APPL????' > "$APP/Contents/PkgInfo"
          VER="0.0.0-dev"
          case "${GITHUB_REF_NAME}" in
            v*) VER="${GITHUB_REF_NAME#v}" ;;
          esac
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleIdentifier</key>
            <string>com.guocheng.alliph</string>
            <key>CFBundleName</key>
            <string>全能外设</string>
            <key>CFBundleDisplayName</key>
            <string>全能外设</string>
            <key>CFBundleExecutable</key>
            <string>apxdesktop</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${VER}</string>
            <key>CFBundleVersion</key>
            <string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key>
            <string>12.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSMicrophoneUsageDescription</key>
            <string>用手机当电脑麦克风：把手机收到的声音转发给本机应用（会议/录音软件）。</string>
            <key>NSAudioCaptureUsageDescription</key>
            <string>把电脑系统声音投到手机扬声器播放（macOS 14.2+ 系统音频采集）。</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$APP/Contents/Info.plist"
          # web/ 先进 bundle，再统一签名（顺序是本修复的核心，见上方注释）
          mkdir -p "$APP/Contents/MacOS/web"
          cp -r ../pc/web/dist/. "$APP/Contents/MacOS/web/"
          codesign --force -s - "$STAGE/apxhost"
          codesign --force -s - "$STAGE/apxdesktop"
          codesign --force -s - "$APP/Contents/MacOS/apxdesktop"
          codesign --force -s - "$APP"
          codesign --verify --strict "$APP"
          codesign -dvv "$APP" 2>&1 | head -3
          echo "ad-hoc 签名完成（web 已在 bundle 内一并封印，verify --strict 通过）"

          cat > "$STAGE/README.txt" <<'README'
          全能外设 macOS（arm64，ad-hoc 签名 · 未公证）

          快速上手：
            双击 AllPeriph.app      桌面壳（自动打开浏览器面板，自带 9511 受控端）
            ./apxdesktop            同上（终端方式，Ctrl+C 退出）
            ./apxhost panel         浏览器控制面板（自动打开 http://127.0.0.1:…/?host=1）
            ./apxhost serve         无界面常驻服务（9511 受控 + 热键）
            ./apxhost list          枚举设备与传感器
            ./apxhost --help        全部命令

          退出：终端方式直接 Ctrl+C；.app 壳 v1 无托盘菜单，用 pkill -x apxdesktop 或活动监视器结束

          首次打开（未公证应用）：
            系统设置 → 隐私与安全性 → 底部「仍要打开」
            或执行：xattr -dr com.apple.quarantine AllPeriph.app ./apxhost ./apxdesktop

          浏览器面板要求 web/ 目录与可执行文件同级（本包已附带）。
          麦克风/音箱首次使用按系统弹窗授权（麦克风 / 系统音频录制，macOS 14.2+）。
          README
          zip -9 -r apxhost-macos-arm64.zip "$STAGE"
          shasum -a 256 apxhost-macos-arm64.zip | tee apxhost-macos-arm64.zip.sha256

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apxhost-macos-arm64
          path: |
            build_host/apxhost-macos-arm64.zip
            build_host/apxhost-macos-arm64.zip.sha256
            build_host/apxdesktop.symbols
            build_host/apxdesktop.symbols.demangled
            build_host/apxhost.symbols
            build_host/apxhost.unstripped
          retention-days: 30

      - name: Upload to GitHub Release (tag builds only)
        # tag 构建时把 zip 重命名为与 Windows/Android 资产同风格的
        # AllPeriph-<tag>-macos-arm64.zip 并上传：
        #   · build.yml 的 release job（needs pc+android，通常更慢）可能还没建 Release ——
        #     不存在则本步先建（标题占位，随后 build.yml 的 softprops 会同 tag 合并更新正文）；
        #     已存在则直接 --clobber 追加 —— 两条路径都幂等，先跑谁都不冲突。
        if: success() && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          cd build_host
          cp apxhost-macos-arm64.zip "AllPeriph-${TAG}-macos-arm64.zip"
          shasum -a 256 "AllPeriph-${TAG}-macos-arm64.zip" > "AllPeriph-${TAG}-macos-arm64.zip.sha256"
          ASSETS="AllPeriph-${TAG}-macos-arm64.zip AllPeriph-${TAG}-macos-arm64.zip.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS \
              --title "全能外设 ${TAG}" \
              --notes "macOS 测试版资产已上传；Windows/Android 资产由 build.yml 随后补充。" \
              || true
            # 竞态兜底：若上面因 Release 已被 build.yml 抢建而失败，再试一次 upload
            gh release upload "$TAG" $ASSETS --clobber
          fi
          echo "mac 资产已进入 Release ${TAG}"

      - name: Publish errors on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          cmake --build build_host -j1 --target apxhost apxdesktop -- -k > /tmp/full.log 2>&1

          # ---- 1) 全量日志尾部推到 ci-logs 分支（先做，不依赖后面的行） ----
          WORK=$(mktemp -d)
          cd "$WORK" || exit 1
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q origin ci-logs; then
            git checkout -q -B ci-logs FETCH_HEAD
          else
            git checkout -q --orphan ci-logs
          fi
          mkdir -p errors
          tail -400 /tmp/full.log > "errors/run_${GITHUB_RUN_ID}.txt"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "ci errors: run ${GITHUB_RUN_ID}" || exit 0
          git push -q origin HEAD:ci-logs && echo "errors -> ci-logs branch"

          # ---- 2) ::error:: 注解（净化 CR、截 400 字符；::error:: 显式分隔防消息被吞） ----
          grep -E "(error:|Undefined symbols|symbol not found|fatal error|no rule to make target)" /tmp/full.log \
            | tr -d '\r' | cut -c1-400 | sed 's/^/::error::/' | head -50
