name: TV Legacy (Android 4.3)

# Android 4.3 (API 18) 兼容链 —— 与主链 AGP 9 完全隔离：
# AGP 7.4.2 + Gradle 7.5.1 + JDK 11 + compileSdk 33 + minSdk 18。
# UI 用 PR #64 迁移前的 Views 快照（a769548），:shared 用主仓当前源码（协议与 PC 端一致）。
# 调试期只手动触发（不挂 push，避免绿之前把 master 状态打红）；绿了再考虑挂 master/PR。
# 不装 android-actions/setup-android：runner 预装 SDK/licenses，该 action 在 run #1 3 秒挂（根因）。
# run #2 起：构建日志经 FAILURE 段转 ::error:: 注解 —— annotations API 直读错误，绕开 logs API 需登录的限制。
# run #5 起：绿了把 APK 强推到 legacy-artifacts 分支 —— raw.githubusercontent.com 匿名可拉。
# run #6 起：本机链路大包体（732KB）超时/CANCEL，APK 额外切 64KB 分片（part_NN）+ sha256，分片拉取后本地 cat 重组。
# run #9 起：构建前用 keytool 生成 $HOME/legacy-release.jks 签 release ——
#   INSTALL_PARSE_FAILED_NO_CERTIFICATES（裸 APK 无法安装）；keystore 指向/DSL 错误是 run#7/8 连挂根因（见 build.gradle.kts 注释）。

on:
  workflow_dispatch:

permissions:
  contents: write # 发布 APK 到 legacy-artifacts 分支需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git archive 需要历史对象

      - name: Materialize legacy snapshot (PR #64 parent = Views 时代)
        run: |
          mkdir -p android-legacy/legacy-snapshot
          git archive a769548437a1794bf5b3329904faddd50a654f20 android/tv | tar -x -C android-legacy/legacy-snapshot
          find android-legacy/legacy-snapshot -type f | wc -l

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11

      - name: Generate release keystore (keytool from JDK 11)
        run: |
          keytool -genkeypair -keystore "$HOME/legacy-release.jks" \
            -storepass android -keypass android \
            -alias tv-legacy -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=TV Legacy, O=APX, C=CN"
          ls -la "$HOME/legacy-release.jks"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.5.1

      - name: Build TV legacy (minSdk 18)
        run: |
          set -o pipefail
          cd android-legacy
          gradle :tv:assembleRelease --stacktrace --no-daemon 2>&1 | tee "$RUNNER_TEMP/legacy-build.log"

      - name: Surface build errors (annotations)
        if: failure()
        run: |
          log="$RUNNER_TEMP/legacy-build.log"
          echo "=== FAILURE 段（gradle 标准错误出口）==="
          if grep -q '^FAILURE: ' "$log"; then
            awk '/^FAILURE: /{f=1} f{print; n++} n>=60{exit}' "$log" | while IFS= read -r line; do
              echo "::error::${line}"
            done
          else
            # 配置期/脚本编译错没有 FAILURE: 兕底抓 e: / What went wrong / Caused by
            grep -E '^(e: |What went wrong|Caused by|> Task .* FAILED)' "$log" | head -60 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          # 尾部 40 行总是打到 step output（查兕底都没抓到时的现场）
          echo "--- last 40 lines ---"
          tail -40 "$log"

      - uses: actions/upload-artifact@v4
        with:
          name: tv-legacy43-apk
          path: android-legacy/tv/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish APK to legacy-artifacts branch (pull channel)
        if: success()
        run: |
          set -e
          apk=$(ls android-legacy/tv/build/outputs/apk/release/*.apk | head -1)
          work=$(mktemp -d)
          cp "$apk" "$work/tv-legacy43.apk"
          cd "$work"
          sha256sum tv-legacy43.apk > tv-legacy43.apk.sha256
          # 64KB 分片 —— 本机链路对 >100KB 单包体超时，分片后逐片拉取
          split -b 65536 -d -a 2 tv-legacy43.apk part_
          ls -la
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tv-legacy43.apk tv-legacy43.apk.sha256 part_*
          git commit -qm "tv-legacy43 apk from run ${GITHUB_RUN_ID}"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -qf origin main:legacy-artifacts
          echo "published parts: $(ls part_* | wc -l), total $(stat -c%s tv-legacy43.apk) bytes"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
