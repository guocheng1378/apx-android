name: AI Edit Channel
# 临时通道（用完即删）：把 edits.json 推到 .github/ci-patches/ 即自动按"精确匹配→替换"应用到本分支。
# 每条 find 必须命中指定次数，两遍校验、先全部 check 再统一写盘；不匹配就红，绝不半成品落盘。
on:
  push:
    branches: ['docs/status-sync']
    paths: ['.github/ci-patches/**']

permissions:
  contents: write

concurrency:
  group: ai-edit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply:
    # 整串必须加引号：表达式里含 ": " 时裸标量会 YAML 报错（v1 踩过）
    if: "${{ !startsWith(github.event.head_commit.message, 'apply-ai-edit') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply edits.json
        run: python3 .github/ci-patches/apply.py
      - name: Commit applied edits
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "ai-edit-bot"
            git config user.email "ai-edit-bot@users.noreply.github.com"
            git add -A
            git commit -m "apply-ai-edit 应用 edits.json"
            git push
          else
            echo "no changes"
          fi
