name: tmp-fix-kbpage
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: restore KeyboardPage full text and apply short-side judgments
        run: |
          set -e
          P='android/app/src/main/java/com/allperiph/ui/compose/KeyboardPage.kt'
          wc -l "$P" || true
          git show '57a9003e2817f436820ee5fd87b4339082bcb922^:'"$P" > "$P"
          grep -q 'fun ApKeyboardPage' "$P"
          grep -q 'import androidx.compose.foundation.layout.Box' "$P"
          test "$(wc -l < "$P")" -gt 1000
          sed -i \
            -e 's|    val widthDp = adaptive.width.value|    val widthDp = adaptive.width.value\n    val shortSide = minOf(widthDp, adaptive.height.value)|' \
            -e 's|        widthDp >= 600f -> 32.dp|        shortSide >= 600f -> 32.dp|' \
            -e 's|        widthDp >= 520f -> 24.dp|        shortSide >= 520f -> 24.dp|' \
            -e 's|    val limited = widthDp >= 840f|    val limited = widthDp >= 840f \&\& shortSide >= 520f|' \
            "$P"
          test "$(grep -c shortSide "$P")" -eq 4
      - name: fix StatusPage import, broken line and dead-resource copy-paste row
        run: |
          set -e
          S='android/app/src/main/java/com/allperiph/ui/compose/StatusPage.kt'
          if ! grep -q '^import com.allperiph.wireless.ControlTarget$' "$S"; then
            grep -q '^import com.allperiph.controlled.ControlledService$' "$S"
            sed -i 's|^import com.allperiph.controlled.ControlledService$|import com.allperiph.controlled.ControlledService\nimport com.allperiph.wireless.ControlTarget|' "$S"
          fi
          grep -q '^import com.allperiph.wireless.ControlTarget$' "$S"
          sed -i '/^    val stateColor = remember(ctx) { stateColor }$/d' "$S"
          if grep -q 'remember(ctx) { stateColor }' "$S"; then echo 'BAD LINE STILL PRESENT'; exit 1; fi
          grep -q 'color = stateColor(row.state)' "$S"
          # 三修：wifi_spk 行的 summary 误抄成 usb_spk，导致 ui_set_sum_wifi_spk 死资源 FAIL
          sed -i '/title = ctx.getString(R.string.ui_set_label_wifi_spk)/{n;s|R.string.ui_set_sum_usb_spk|R.string.ui_set_sum_wifi_spk|}' "$S"
          test "$(grep -c 'ui_set_sum_wifi_spk' "$S")" -eq 1
          test "$(grep -c 'ui_set_sum_usb_spk' "$S")" -eq 1
          echo '--- StatusPage patched (3 fixes) ---'
          grep -n -A1 'ui_set_label_wifi_spk' "$S"
      - name: commit and retag
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m 'fix(status): wifi_spk 行 summary 修正 ui_set_sum_wifi_spk（死资源检查 FAIL）'
          git push origin HEAD:master
          git tag -f v223.29.35
          git push -f origin v223.29.35
          echo 'TAGGED v223.29.35 (moved)'
